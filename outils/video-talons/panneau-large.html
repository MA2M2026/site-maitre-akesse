<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<!-- Format HORIZONTAL de la vidéo « Atelier Talons & Élégance » (10/11/2026) : panneau de gauche reconstruit à
     l'identique de la première vidéo (icône dans un cercle blanc, grand titre, sous-titre, compteur « NN / 15 », trait
     de progression), avec le NOUVEAU texte qui s'allume mot à mot sur la voix ElevenLabs v3 (timing-recale.js, fabriqué
     par recaler-talons.py). Le panneau de droite (cadre fin) reçoit la vidéo verticale recalée, posée par ffmpeg.
     window.rendre(t) : rendu exact image par image. -->
<title>Panneau horizontal</title>
<script src="timing-recale.js"></script>
<style>
@font-face { font-family: 'Big Shoulders Display'; font-weight: 800; src: url('../../assets/polices/big-shoulders-display-latin-800-normal.woff2'); }
@font-face { font-family: 'Big Shoulders Display'; font-weight: 800; src: url('../../assets/polices/big-shoulders-display-latin-ext-800-normal.woff2'); unicode-range: U+0100-024F; }
@font-face { font-family: 'Jost'; font-weight: 500; src: url('../../assets/polices/jost-latin-500-normal.woff2'); }
@font-face { font-family: 'Jost'; font-weight: 400; src: url('../../assets/polices/jost-latin-400-normal.woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 400; font-style: italic; src: url('../../assets/polices/cormorant-garamond-latin-400-italic.woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 400; font-style: italic; src: url('../../assets/polices/cormorant-garamond-latin-ext-400-italic.woff2'); unicode-range: U+0100-024F; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { color: #fff; background: radial-gradient(ellipse 70% 85% at 31% 39%, #7A2025 0%, #6A1720 38%, #4F0E15 72%, #3A080E 100%); font-family: 'Jost', sans-serif; }
#entete { position: absolute; left: 80px; top: 48px; width: 715px; display: flex; justify-content: space-between; font: 500 15px 'Jost'; letter-spacing: 0.34em; }
#compteur { letter-spacing: 0.28em; }
#bloc { position: absolute; left: 80px; top: 0; width: 720px; height: 720px; }
.icone { position: absolute; left: 0; width: 112px; height: 112px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 56px; line-height: 1;
  font-family: 'Noto Color Emoji', sans-serif; box-shadow: 0 0 0 12px rgba(255,255,255,0.13), 0 0 0 13px rgba(255,255,255,0.2); }
.titre { position: absolute; left: 0; width: 720px; font: 800 70px/0.98 'Big Shoulders Display'; text-transform: uppercase; letter-spacing: 0.005em; }
.sous { position: absolute; left: 0; font: 400 24px 'Jost'; opacity: 0.95; }
#texte { position: absolute; left: 80px; width: 712px; font: italic 400 31px/1.36 'Cormorant Garamond'; }
#texte span { transition: none; }
#barre { position: absolute; left: 80px; top: 671px; width: 715px; height: 2px; background: rgba(255,255,255,0.22); }
#barre i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
#cadre { position: absolute; left: 877px; top: 12px; width: 392px; height: 696px; border: 1px solid rgba(255,255,255,0.55); background: #3E0A10; }
</style></head>
<body>
<div id="entete"><span>MAÎTRE AKESSE MODEL MANAGEMENT</span><span id="compteur">01 / 15</span></div>
<div id="bloc"></div>
<div id="texte"></div>
<div id="barre"><i></i></div>
<div id="cadre"></div>
<script>
const D = window.D, bloc = document.getElementById('bloc'), texte = document.getElementById('texte');
const lisse = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const sortie = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
// une « carte » par scène : icône, titre, sous-titre (positions mesurées pour que le texte vienne juste dessous)
const cartes = D.scenes.map((s) => {
  const el = document.createElement('div'); el.style.position = 'absolute'; el.style.inset = '0';
  el.innerHTML = '<div class="icone">' + s.icone + '</div><div class="titre">' + s.titre + '</div><div class="sous">' + s.sous + '</div>';
  bloc.appendChild(el); return el;
});
// mise en page de chaque carte : icône, titre (1 ou 2 lignes), sous-titre ; l'ensemble est centré verticalement
// (calculée au premier rendu, une fois les polices chargées : sinon les hauteurs mesurées sont fausses)
let misEnPage = false;
function mettreEnPage() { misEnPage = true; cartes.forEach((el, i) => {
  const ic = el.querySelector('.icone'), ti = el.querySelector('.titre'), so = el.querySelector('.sous');
  const hTitre = ti.getBoundingClientRect().height;
  const hTexte = D.scenes[i].hauteurTexte || 130;
  const total = 112 + 44 + hTitre + 14 + 30 + 28 + hTexte;
  const haut = Math.max(118, 360 - total / 2);
  ic.style.top = haut + 'px'; ti.style.top = (haut + 156) + 'px'; so.style.top = (haut + 156 + hTitre + 14) + 'px';
  D.scenes[i].hautTexte = haut + 156 + hTitre + 14 + 30 + 28;
}); }
// texte en morceaux : chaque mot est une balise, allumée à son instant
const morceaux = D.morceaux.map((m) => ({ ...m, html: m.mots.map(([w], k) => '<span data-k="' + k + '">' + w + '</span>').join(' ') }));
let courant = -1;
window.rendre = (t) => {
  if (!misEnPage && document.fonts.status === 'loaded') mettreEnPage();
  // scène courante (la dernière commencée) et précédente (pendant le fondu)
  let i = 0; while (i + 1 < D.scenes.length && D.scenes[i + 1].debut <= t) i++;
  // l'ancienne carte s'efface d'abord (0,25 s), puis la nouvelle arrive (jamais deux titres l'un sur l'autre)
  const dt = t - D.scenes[i].debut, partie = lisse(dt / 0.25), arrivee = lisse((dt - 0.22) / 0.45);
  cartes.forEach((el, j) => {
    let o = 0, y = 0;
    if (j === i) { o = i === 0 ? lisse(t / 0.8) : arrivee; y = 26 * (1 - sortie((dt - 0.22) / 0.7)); }
    else if (j === i - 1 && partie < 1) { o = 1 - partie; y = -14 * partie; }
    el.style.opacity = o; el.style.transform = 'translateY(' + y + 'px)'; el.style.visibility = o > 0 ? 'visible' : 'hidden';
    el.querySelector('.icone').style.transform = j === i ? 'scale(' + (0.6 + 0.4 * sortie((dt - 0.22) / 0.6)) + ')' : '';
  });
  document.getElementById('compteur').textContent = String(i + 1).padStart(2, '0') + ' / ' + D.scenes.length;
  const fin = i + 1 < D.scenes.length ? D.scenes[i + 1].debut : D.duree;
  document.querySelector('#barre i').style.width = (100 * Math.min(1, Math.max(0, (t - D.scenes[i].debut) / (fin - D.scenes[i].debut)))) + '%';
  // morceau de texte courant (visible de son début jusqu'au suivant), mots allumés au fil de la voix
  let m = -1; morceaux.forEach((x, j) => { if (t >= x.debut && t < x.fin) m = j; });
  if (m !== courant) { courant = m; texte.innerHTML = m >= 0 ? morceaux[m].html : ''; }
  texte.style.top = D.scenes[i].hautTexte + 'px';
  if (m >= 0) {
    const x = morceaux[m];
    texte.style.opacity = Math.min(lisse((t - x.debut) / 0.3), lisse((x.fin - t) / 0.3));
    texte.querySelectorAll('span').forEach((s) => { const tm = x.mots[Number(s.dataset.k)][1]; s.style.color = t >= tm ? '#fff' : 'rgba(255,255,255,0.28)'; });
  }
};
</script>
</body></html>
