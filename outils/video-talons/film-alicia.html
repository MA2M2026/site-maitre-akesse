<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<!-- Vidéo « Alicia Kouadio — La juste mesure » (13/11/2026, demande de la propriétaire) : une HISTOIRE racontée sur
     une mannequin de 1,69 m, en motion design de luxe (noir profond, or champagne, ivoire), différente des films
     précédents : chaque phrase de la voix a son illustration animée (fente de lumière, toise dorée, croquis de mode,
     triptyque qui se déplie, podium en perspective, iris d'objectif, viseur de caméra, couleur qui prend vie,
     typographie remplie de photos, cartes des métiers, porte de lumière, compcard animée, kt de fin).
     Voix « Victoria » fournie par la propriétaire (ElevenLabs), texte voix-alicia.json calé par aligner-voix.py ;
     musique et effets sonores ElevenLabs (alicia/musique.mp3, sons/a-*.mp3). Photos : son book du site (alicia/),
     détourages rembg (alicia/d-*.png). Moteur PROPRE à ce film (window.rendre(t), window.EFFETS, window.MANQUES), lu
     par fabrique-talons.js :
       FILM=film-alicia.html NOM=alicia-kouadio SONS=1 VOIX=… MUSIQUE=… IMAGES=… node fabrique-talons.js [vertical|large] -->
<title>Film Alicia Kouadio</title>
<script src="timing-alicia.js"></script>
<style>
/* polices du site (mêmes que moteur-film.css, sans ses autres styles) */
@font-face { font-family: 'Cormorant Garamond'; font-weight: 500; src: url('../../assets/polices/cormorant-garamond-latin-500-normal.woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 500; src: url('../../assets/polices/cormorant-garamond-latin-ext-500-normal.woff2'); unicode-range: U+0100-024F; }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 400; font-style: italic; src: url('../../assets/polices/cormorant-garamond-latin-400-italic.woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 600; src: url('../../assets/polices/cormorant-garamond-latin-600-normal.woff2'); }
@font-face { font-family: 'Work Sans'; font-weight: 400; src: url('../../assets/polices/work-sans-latin-400-normal.woff2'); }
@font-face { font-family: 'Work Sans'; font-weight: 500; src: url('../../assets/polices/work-sans-latin-500-normal.woff2'); }
@font-face { font-family: 'Work Sans'; font-weight: 600; src: url('../../assets/polices/work-sans-latin-600-normal.woff2'); }
@font-face { font-family: 'Work Sans'; font-weight: 700; src: url('../../assets/polices/work-sans-latin-700-normal.woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url('../../assets/polices/montserrat-latin-700-normal.woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url('../../assets/polices/montserrat-latin-ext-700-normal.woff2'); unicode-range: U+0100-024F; }
@font-face { font-family: 'Big Shoulders Display'; font-weight: 800; src: url('../../assets/polices/big-shoulders-display-latin-800-normal.woff2'); }
@font-face { font-family: 'Big Shoulders Display'; font-weight: 800; src: url('../../assets/polices/big-shoulders-display-latin-ext-800-normal.woff2'); unicode-range: U+0100-024F; }
:root { --W: 1080px; --H: 1920px; }
body.large { --W: 1920px; --H: 1080px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--W); height: var(--H); overflow: hidden; background: #060607; }
body { font-family: 'Work Sans', sans-serif; color: #fff; }
#film { position: relative; width: var(--W); height: var(--H); overflow: hidden; }
:root { --or: #D8B878; --or-clair: #F3DFAE; --or-fonce: #9C7A3C; --ivoire: #F5EEE3; --noir: #060607; --rouge-ma2m: #7C2128; }
#film { background: var(--noir); }
.sc { position: absolute; inset: 0; overflow: hidden; visibility: hidden; background: radial-gradient(ellipse at 50% 38%, #18171A 0%, #09090B 55%, #000 100%); }

.ital { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }
.caps { font-family: 'Work Sans', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.38em; }
.or { color: var(--or); }
.centre { left: 0; right: 0; text-align: center; }
.trait { stroke: var(--or); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lettre { display: inline-block; will-change: transform, opacity; }
.cadre-or { position: absolute; inset: 26px; border: 1px solid rgba(216,184,120,0.35); pointer-events: none; z-index: 60; }

#balayage { position: absolute; inset: -20%; z-index: 58; pointer-events: none; opacity: 0; background: linear-gradient(105deg, rgba(243,223,174,0) 40%, rgba(243,223,174,0.55) 49%, rgba(255,255,255,0.8) 50%, rgba(243,223,174,0.55) 51%, rgba(243,223,174,0) 60%); mix-blend-mode: screen; }

<body>
<div id="film">
  <div id="scenes"></div>
  <canvas id="poussiere"></canvas>
  <div id="vignette"></div>
  <div id="st-fond"></div>
  <div id="st"></div>
  <div id="balayage"></div>
  <div id="flash"></div>
  <div class="cadre-or"></div>
  <div id="grain"></div>
</div>
<script>
'use strict';
if (/format=large/.test(location.search)) document.body.classList.add('large');
const LARGE = document.body.classList.contains('large'), W = LARGE ? 1920 : 1080, H = LARGE ? 1080 : 1920;
const V = (v, l) => (LARGE ? l : v);  // valeur pour le format vertical, ou horizontal
const T = window.T, MOTS = T.mots, PH = T.phrases;
window.MANQUES = [];
// ---------- outils ----------
const cl = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const io = (x) => { x = cl(x); return x * x * (3 - 2 * x); };
const out = (x) => { x = cl(x); return 1 - Math.pow(1 - x, 3); };
const expo = (x) => { x = cl(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const back = (x) => { x = cl(x); const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const k = (t, a, d) => cl((t - a) / d);
const mix = (a, b, x) => a + (b - a) * x;
const norm = (m) => m.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, "'").replace(/^(?:[ldjmnstc]|qu)'/, '');
// instant où la voix dit le mot (n-ième occurrence dans la phrase)
function w(cle, mot, n) {
  const l = (MOTS[cle] || []).filter((x) => norm(x[0]) === norm(mot));
  const x = l[n || 0];
  if (!x) { window.MANQUES.push(cle + ':' + mot); return PH[cle] ? PH[cle][0] : 0; }
  return x[1];
}
const debut = (cle) => PH[cle][0], fin = (cle) => PH[cle][1];
function style(el, o) {
  if (!el) return;
  const tr = [];
  if (o.x !== undefined || o.y !== undefined) tr.push('translate(' + (o.x || 0) + 'px,' + (o.y || 0) + 'px)');
  if (o.z !== undefined) tr.push('translateZ(' + o.z + 'px)');
  if (o.rx !== undefined) tr.push('rotateX(' + o.rx + 'deg)');
  if (o.ry !== undefined) tr.push('rotateY(' + o.ry + 'deg)');
  if (o.r !== undefined) tr.push('rotate(' + o.r + 'deg)');
  if (o.s !== undefined) tr.push('scale(' + o.s + ')');
  if (tr.length) el.style.transform = tr.join(' ');
  if (o.o !== undefined) el.style.opacity = o.o;
  if (o.b !== undefined) el.style.filter = o.b > 0.05 ? 'blur(' + o.b + 'px)' : '';
  if (o.clip !== undefined) { el.style.clipPath = o.clip; el.style.webkitClipPath = o.clip; }
}
// tracé SVG qui se dessine (pathLength="1")
const dessine = (els, x) => els.forEach((p) => { p.style.strokeDasharray = '1 1'; p.style.strokeDashoffset = String(1 - cl(x)); });
// lettres séparées pour les animer une à une
const lettres = (txt) => [...txt].map((c) => '<span class="lettre">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
const photo = (n) => 'alicia/' + n + '.jpg';
const ICONES = {
  plume: '<path pathLength="1" d="M80 10 C44 18 24 48 20 88"/><path pathLength="1" d="M80 10 C78 40 60 64 28 74"/><path pathLength="1" d="M34 62 L58 46 M40 52 L66 34 M30 72 L50 60"/>',
  eclair: '<path pathLength="1" d="M58 6 L26 54 L50 54 L40 94 L76 40 L52 40 Z"/>',
  cintre: '<path pathLength="1" d="M50 34 C50 22 64 22 64 30 C64 37 55 38 50 44 L10 70 C6 73 8 78 13 78 L87 78 C92 78 94 73 90 70 L50 44"/>',
  diamant: '<path pathLength="1" d="M20 38 L34 20 L66 20 L80 38 L50 84 Z M20 38 L80 38 M40 38 L50 84 L60 38 M34 20 L40 38 M66 20 L60 38"/>',
  appareil: '<path pathLength="1" d="M12 34 L30 34 L36 22 L64 22 L70 34 L88 34 L88 80 L12 80 Z"/><circle pathLength="1" cx="50" cy="56" r="15"/><circle pathLength="1" cx="50" cy="56" r="6"/>',
  ciseaux: '<circle pathLength="1" cx="30" cy="76" r="11"/><circle pathLength="1" cx="70" cy="76" r="11"/><path pathLength="1" d="M37 67 L74 14 M63 67 L26 14"/>',
  crayon: '<path pathLength="1" d="M18 84 L26 62 L70 18 L84 32 L40 76 Z M26 62 L40 76 M62 26 L76 40"/>',
  etiquette: '<path pathLength="1" d="M10 50 L44 16 L86 16 L86 58 L52 92 Z"/><circle pathLength="1" cx="71" cy="31" r="6"/>',
  oeil: '<path pathLength="1" d="M8 50 C28 22 72 22 92 50 C72 78 28 78 8 50 Z"/><circle pathLength="1" cx="50" cy="50" r="13"/>',
  main: '<path pathLength="1" d="M34 90 L30 56 C29 50 36 48 38 54 L40 64 L40 22 C40 16 48 16 48 22 L48 54 L48 14 C48 8 56 8 56 14 L56 54 L56 20 C56 14 64 14 64 20 L64 56 L64 32 C64 26 72 26 72 32 L72 64 C72 78 66 90 60 90 Z"/>',
  sourire: '<circle pathLength="1" cx="50" cy="50" r="40"/><path pathLength="1" d="M30 58 C38 72 62 72 70 58"/><path pathLength="1" d="M36 40 L36 42 M64 40 L64 42"/>'
};
const icone = (nom, taille, cls) => '<svg class="' + (cls || '') + '" viewBox="0 0 100 100" width="' + taille + '" height="' + taille + '"><g class="trait">' + ICONES[nom] + '</g></svg>';

// ---------- effets sonores (fabrique-talons.js les mixe : sons/<son>.mp3, volume vol) ----------
const EFFETS = [];
const son = (t, nom, vol) => EFFETS.push({ t: +Math.max(0, t).toFixed(3), son: 'a-' + nom, vol: vol || 0.5 });

// ---------- scènes ----------
const racine = document.getElementById('scenes');
const SC = [];
// id, début, html, mise à jour (t absolu, élément), entrée (fondu | iris | volet | zoom | rideau | fente), sous-titres ?
function scene(o) {
  const el = document.createElement('section'); el.className = 'sc'; el.id = 's-' + o.id; el.innerHTML = o.html; racine.appendChild(el);
  o.el = el; o.q = (s) => el.querySelector(s); o.qa = (s) => [...el.querySelectorAll(s)];
  if (o.prep) o.prep(o);
  SC.push(o); return o;
}

// 1. OUVERTURE — une fente de lumière s'ouvre sur son visage
scene({ id: 'ouverture', de: 0, entree: 'aucune',
  html: '<div class="img grade" id="o-img" style="inset:0;background-image:url(' + photo('p05') + ');background-position:50% 30%"></div>' +
    '<div class="abs" id="o-ligne" style="left:50%;top:' + V(820, 470) + 'px;height:2px;width:0;background:linear-gradient(90deg,transparent,var(--or-clair),transparent);box-shadow:0 0 30px 6px rgba(243,223,174,0.55)"></div>' +
    '<div class="abs caps centre" id="o-1" style="top:' + V(300, 150) + 'px;font-size:' + V(30, 26) + 'px;color:var(--ivoire)">Il y a des femmes</div>' +
    '<div class="abs ital centre" id="o-2" style="top:' + V(1080, 760) + 'px;font-size:' + V(120, 110) + 'px;color:var(--ivoire)">' + lettres('que l’on remarque.') + '</div>',
  prep: (s) => { son(0.2, 'montee', 0.45); son(0.95, 'eclat', 0.35); son(debut('ouverture') + 0.05, 'souffle', 0.5); },
  maj: (t, s) => {
    const a = debut('ouverture');
    const lg = expo(k(t, 0.25, 0.9)), ouv = out(k(t, a - 0.05, 1.6));
    style(s.q('#o-ligne'), { o: 1 - ouv * 0.9 }); s.q('#o-ligne').style.width = (lg * V(80, 60)) + '%'; s.q('#o-ligne').style.left = (50 - lg * V(40, 30)) + '%';
    const c = V(820, 470) / H * 100, demi = ouv * 60;
    style(s.q('#o-img'), { clip: 'inset(' + Math.max(0, c - demi) + '% 0 ' + Math.max(0, 100 - c - demi) + '% 0)', s: mix(1.28, 1.08, io(k(t, a, 4))), b: mix(14, 0, out(k(t, a, 1.4))) });
    style(s.q('#o-1'), { o: out(k(t, a, 0.8)) * (1 - k(t, w('ouverture', 'que') + 0.2, 0.6) * 0.4), y: mix(30, 0, out(k(t, a, 1))) });
    const t0 = w('ouverture', 'que');
    s.qa('#o-2 .lettre').forEach((l, i) => style(l, { o: out(k(t, t0 + i * 0.045, 0.6)), y: mix(40, 0, out(k(t, t0 + i * 0.045, 0.8))), b: mix(10, 0, out(k(t, t0 + i * 0.045, 0.6))) }));
  } });

// 2. OUBLI — elle s'avance, auréolée d'or
scene({ id: 'oubli', de: debut('oubli') - 0.15, entree: 'iris',
  html: '<div class="img" id="b-fond" style="inset:-5%;background-image:url(' + photo('p01') + ');filter:blur(26px) brightness(0.35) saturate(0.8)"></div>' +
    '<svg class="abs" id="b-halo" viewBox="0 0 100 100" style="left:' + V(90, 760) + 'px;top:' + V(440, 60) + 'px;width:' + V(900, 900) + 'px;height:' + V(900, 900) + 'px"><circle pathLength="1" cx="50" cy="50" r="46" class="trait" style="stroke-width:0.35"/><circle pathLength="1" cx="50" cy="50" r="40" class="trait" style="stroke-width:0.18;opacity:0.6"/></svg>' +
    '<img class="abs" id="b-det" src="alicia/d-p01.png" style="left:50%;bottom:0;height:' + V(1350, 1000) + 'px;transform-origin:50% 100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,0.8))">' +
    '<div class="abs ital" id="b-1" style="left:' + V(80, 120) + 'px;top:' + V(200, 260) + 'px;font-size:' + V(84, 92) + 'px;color:var(--ivoire)">que l’on découvre</div>' +
    '<div class="abs ital" id="b-2" style="left:' + V(80, 120) + 'px;top:' + V(310, 380) + 'px;font-size:' + V(84, 92) + 'px;color:var(--ivoire)">et que l’on <span class="or">n’oublie plus.</span></div>',
  prep: (s) => { son(s.de, 'souffle', 0.45); son(w('oubli', "n'oublie"), 'eclat', 0.35); },
  maj: (t, s) => {
    const a = s.de, d = w('oubli', 'découvre'), n = w('oubli', 'et', 1);
    style(s.q('#b-fond'), { s: mix(1.1, 1.0, io(k(t, a, 5))) });
    const img = s.q('#b-det'); img.style.marginLeft = (-img.offsetWidth / 2 + V(60, 260)) + 'px';
    style(img, { y: mix(120, 0, out(k(t, a, 2.2))), s: mix(0.94, 1.02, io(k(t, a, 5))), o: out(k(t, a, 0.8)) });
    const halo = s.q('#b-halo'); dessine([...halo.querySelectorAll('circle')], io(k(t, a + 0.3, 2.4))); style(halo, { r: (t - a) * 6 });
    style(s.q('#b-1'), { o: out(k(t, d - 0.1, 0.7)), x: mix(-40, 0, out(k(t, d - 0.1, 1))) });
    style(s.q('#b-2'), { o: out(k(t, n - 0.1, 0.7)), x: mix(-40, 0, out(k(t, n - 0.1, 1))) });
  } });

// 3. NOM — ALICIA, lettres remplies de photo, KOUADIO, 25 ANS
scene({ id: 'nom', de: debut('nom') - 0.2, entree: 'volet', sansSt: true,
  html: '<div class="img" id="n-fond" style="inset:-4%;background-image:url(' + photo('p12') + ');filter:brightness(0.22) saturate(0.7) blur(3px)"></div>' +
    '<div class="abs caps centre or" id="n-0" style="top:' + V(560, 250) + 'px;font-size:' + V(28, 26) + 'px">Elle s’appelle</div>' +
    '<div class="abs serif centre" id="n-1" style="top:' + V(640, 300) + 'px;font-size:' + V(270, 300) + 'px;line-height:1;letter-spacing:0.02em;perspective:900px">' +
      [...'ALICIA'].map((c) => '<span class="lettre" style="background:url(' + photo('p12') + ') 50% 40%/' + V(1100, 1500) + 'px auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(243,223,174,0.5)">' + c + '</span>').join('') + '</div>' +
    '<div class="abs caps centre" id="n-2" style="top:' + V(935, 630) + 'px;font-size:' + V(64, 66) + 'px;color:var(--ivoire);font-weight:500">Kouadio</div>' +
    '<div class="abs" id="n-3" style="left:50%;top:' + V(1100, 760) + 'px;width:220px;height:220px;margin-left:-110px">' +
      '<svg viewBox="0 0 100 100" width="220" height="220" style="position:absolute;inset:0"><circle pathLength="1" cx="50" cy="50" r="46" class="trait" style="stroke-width:1"/></svg>' +
      '<div class="serif or" id="n-age" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:92px;line-height:0.9">25<small style="font:600 20px Work Sans;letter-spacing:0.4em;margin-top:10px;margin-left:8px">ANS</small></div></div>',
  prep: (s) => { son(s.de, 'souffle', 0.4); son(w('nom', 'alicia') - 0.05, 'impact', 0.55); son(w('nom', 'kouadio'), 'soie', 0.5); son(w('nom', '25'), 'declic', 0.45); },
  maj: (t, s) => {
    const a = w('nom', 'alicia'), b = w('nom', 'kouadio'), c = w('nom', '25');
    style(s.q('#n-fond'), { s: mix(1.12, 1.0, io(k(t, s.de, 4))) });
    style(s.q('#n-0'), { o: out(k(t, s.de + 0.1, 0.6)) });
    s.qa('#n-1 .lettre').forEach((l, i) => { const x = k(t, a - 0.15 + i * 0.07, 0.75); style(l, { o: out(x), y: mix(-70, 0, back(x)), rx: mix(-80, 0, out(x)), b: mix(8, 0, out(x)) }); l.style.backgroundPosition = (50 + (t - a) * 3) + '% 40%'; });
    const xb = k(t, b - 0.1, 1.1); style(s.q('#n-2'), { o: out(xb) }); s.q('#n-2').style.letterSpacing = mix(1.1, 0.42, out(xb)) + 'em';
    const xc = k(t, c - 0.1, 0.9); dessine(s.qa('#n-3 circle'), out(xc)); style(s.q('#n-age'), { o: out(k(t, c, 0.5)), s: mix(0.6, 1, back(k(t, c, 0.6))) });
  } });

// 4. TAILLE — toise dorée, 1,69 m, grâce et énergie
const SOL = V(1290, 1000), PXCM = V(5.6, 4.3);  // sol de la toise et pixels par centimètre
scene({ id: 'taille', de: debut('taille') - 0.25, entree: 'fondu',
  html: '<div class="abs" style="left:0;right:0;top:' + SOL + 'px;bottom:0;background:linear-gradient(180deg,rgba(216,184,120,0.10),rgba(0,0,0,0) 60%)"></div>' +

// ---------- fins des scènes : chacune reste jusqu'à la fin de l'entrée de la suivante ----------
SC.forEach((s, i) => { s.a = i < SC.length - 1 ? SC[i + 1].de + 1.0 : T.duree + 1; });
// balayage doré et sons de transition à chaque changement de scène (sauf la première)
SC.slice(1).forEach((s) => { if (s.entree !== 'fondu') son(s.de, 'souffle', 0.25); });

// ---------- entrées ----------
function entree(s, t) {
  const x = k(t, s.de, s.entree === 'fondu' ? 0.8 : 1.0), e = io(x);
  const el = s.el;
  el.style.opacity = ''; el.style.clipPath = ''; el.style.transform = ''; el.style.filter = '';
  if (x >= 1 || s.entree === 'aucune') return;
  if (s.entree === 'fondu') el.style.opacity = e;
  else if (s.entree === 'iris') el.style.clipPath = 'circle(' + (expo(x) * 75) + '% at 50% 45%)';
  else if (s.entree === 'volet') el.style.clipPath = 'inset(0 ' + (100 - expo(x) * 100) + '% 0 0)';
  else if (s.entree === 'rideau') el.style.clipPath = 'inset(' + (50 - expo(x) * 50) + '% 0 ' + (50 - expo(x) * 50) + '% 0)';
  else if (s.entree === 'zoom') { el.style.opacity = out(x * 1.4); el.style.transform = 'scale(' + mix(1.35, 1, expo(x)) + ')'; el.style.filter = 'blur(' + mix(18, 0, out(x)) + 'px)'; }
}

// ---------- poussière d'or, grain ----------
const cv = document.getElementById('poussiere'); cv.width = W; cv.height = H; const cx = cv.getContext('2d');
let graine = 11; const alea = () => { graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
const GRAINS = Array.from({ length: 90 }, () => ({ x: alea() * W, y: alea() * H, r: 0.6 + alea() * 2.6, v: 6 + alea() * 22, d: alea() * 6.28, f: 0.5 + alea() * 1.5 }));
function poussiere(t) {
  cx.clearRect(0, 0, W, H); cx.globalCompositeOperation = 'lighter';
  GRAINS.forEach((g) => {
    const y = ((g.y - g.v * t) % H + H) % H, x = g.x + Math.sin(t * 0.4 + g.d) * 30, a = 0.18 + 0.5 * (0.5 + 0.5 * Math.sin(t * g.f + g.d));
    const gr = cx.createRadialGradient(x, y, 0, x, y, g.r * 4); gr.addColorStop(0, 'rgba(243,223,174,' + a + ')'); gr.addColorStop(1, 'rgba(243,223,174,0)');
    cx.fillStyle = gr; cx.beginPath(); cx.arc(x, y, g.r * 4, 0, 6.283); cx.fill();
  });
}
// éclats d'or (la tenue prend vie)
const ECLATS = Array.from({ length: 70 }, () => ({ a: alea() * 6.283, v: 300 + alea() * 900, r: 1 + alea() * 3 }));
function eclats(t, t0) {
  const lt = t - t0; if (lt < 0 || lt > 1.6) return;
  const ox = W / 2, oy = H * 0.55;
  ECLATS.forEach((e) => { const d = e.v * out(lt / 1.6), x = ox + Math.cos(e.a) * d, y = oy + Math.sin(e.a) * d + 120 * lt * lt, al = 1 - lt / 1.6;
    cx.fillStyle = 'rgba(243,223,174,' + al + ')'; cx.beginPath(); cx.arc(x, y, e.r, 0, 6.283); cx.fill(); });
}
const g = document.createElement('canvas'); g.width = g.height = 256; const gx = g.getContext('2d'); const id = gx.createImageData(256, 256);
for (let i = 0; i < id.data.length; i += 4) { const v = alea() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
gx.putImageData(id, 0, 0); document.getElementById('grain').style.backgroundImage = 'url(' + g.toDataURL() + ')';

// ---------- sous-titres ----------
const st = document.getElementById('st'), stFond = document.getElementById('st-fond');
let stCle = null;
function sousTitres(t, cache) {
  const cles = Object.keys(PH); const cle = cles.find((c) => t >= PH[c][0] - 0.15 && t <= PH[c][1] + 0.35);
  if (!cle || cache) { st.style.opacity = 0; stFond.style.opacity = 0; return; }
  if (cle !== stCle) { stCle = cle; st.innerHTML = MOTS[cle].map((m) => '<span>' + m[0] + '</span>').join(' '); }
  const ex = k(t, PH[cle][1] + 0.05, 0.3);
  st.style.opacity = String(out(k(t, PH[cle][0] - 0.15, 0.2)) * (1 - ex)); stFond.style.opacity = '1';
  [...st.children].forEach((sp, i) => { const m = MOTS[cle][i]; const dit = t >= m[1] - 0.05; sp.style.opacity = dit ? 1 : 0.38; sp.style.color = t >= m[1] - 0.05 && t < m[2] + 0.1 ? 'var(--or-clair)' : ''; });
}

// ---------- image à l'instant t ----------
const flash = document.getElementById('flash'), balayage = document.getElementById('balayage');
window.rendre = (t) => {
  let actif = null;
  SC.forEach((s) => {
    const vis = t >= s.de && t < s.a;
    s.el.style.visibility = vis ? 'visible' : 'hidden';
    if (vis) { entree(s, t); s.maj(t, s); actif = s; }
  });
  // flash d'appareil photo
  let fl = 0; SC.forEach((s) => { if (s.flash) { const f = s.flash(); fl = Math.max(fl, t >= f ? Math.max(0, 1 - (t - f) / 0.35) * 0.85 : 0); } });
  flash.style.opacity = fl;
  // balayage doré sur chaque changement de scène
  let b = 0, bx = 0; SC.slice(1).forEach((s) => { const x = (t - s.de + 0.2) / 0.9; if (x > 0 && x < 1) { b = Math.sin(x * Math.PI) * 0.55; bx = mix(-60, 60, x); } });
  balayage.style.opacity = b; balayage.style.transform = 'translateX(' + bx + '%)';
  poussiere(t); SC.forEach((s) => { if (s.eclats) eclats(t, s.eclats()); });
  const gr = document.getElementById('grain'); gr.style.transform = 'translate(' + ((Math.floor(t * 24) * 37) % 200 - 100) + 'px,' + ((Math.floor(t * 24) * 71) % 200 - 100) + 'px)';
  sousTitres(t, actif && actif.sansSt);
};
window.EFFETS = EFFETS.sort((a, b) => a.t - b.t);
// toutes les images chargées ET décodées avant la première image du film (lu par fabrique-talons.js : window.PRET)
const SRC = new Set(['alicia/d-p00.png', 'alicia/d-p01.png', 'alicia/d-p02.png', 'alicia/d-p06.png', '../../assets/logo-intro.png']);
for (let i = 0; i < 14; i++) SRC.add(photo('p' + String(i).padStart(2, '0')));
window.PRET = Promise.all([...SRC].map((u) => { const im = new Image(); im.src = u; return im.decode().catch(() => { window.MANQUES.push('image ' + u); }); })).then(() => document.fonts.ready);
const p = new URLSearchParams(location.search).get('t'); if (p) window.rendre(+p); else window.rendre(0);
</script>
