<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; overflow-x: hidden; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  /* ===== Trois éditions : couleurs et lettres ===== */
  .ed-vogue    { --scene: #E9E6E2; --papier: #FFFFFF; --encre: #141110; --gris: #6E6560; --rouge: #C8102E;
                 --titre: "Bodoni Moda", Georgia, serif; --titre-poids: 500; --texte: "Instrument Sans", system-ui, sans-serif; --titre-casse: none; --titre-espace: -.01em; }
  .ed-noir     { --scene: #050505; --papier: #0E0E0E; --encre: #F4F1EC; --gris: #9C978F; --rouge: #E0213F;
                 --titre: "Archivo", system-ui, sans-serif; --titre-poids: 800; --texte: "Archivo", system-ui, sans-serif; --titre-casse: uppercase; --titre-espace: -.01em; }
  .ed-lookbook { --scene: #CFC6BB; --papier: #F1ECE5; --encre: #1B1817; --gris: #655D56; --rouge: #C8102E;
                 --titre: "Big Shoulders Display", system-ui, sans-serif; --titre-poids: 800; --texte: "Work Sans", system-ui, sans-serif; --titre-casse: uppercase; --titre-espace: 0; }
  .ed-noir .titre-x { font-variation-settings: "wdth" 70; }

  body { background: var(--scene); color: var(--encre); font-family: var(--texte); transition: background .4s; }
  .edition { display: none; }
  .edition.actif { display: block; }

  /* ===== Une page de magazine (format 3:4) : tout est mesuré en largeur de page (cqw) ===== */
  .page { position: relative; width: var(--W); aspect-ratio: 3 / 4; background: var(--papier); color: var(--encre); overflow: hidden; container-type: inline-size; }
  .page .cadre { overflow: hidden; background: #888; }
  .folio { position: absolute; left: 6cqw; right: 6cqw; bottom: 3.4cqw; display: flex; justify-content: space-between; font-size: 2.3cqw; letter-spacing: .08em; color: var(--gris); }
  .pair .folio { flex-direction: row-reverse; }
  .titre-x { font-family: var(--titre); font-weight: var(--titre-poids); text-transform: var(--titre-casse); letter-spacing: var(--titre-espace); line-height: .95; }
  .rubrique { font-size: 2.4cqw; letter-spacing: .14em; text-transform: uppercase; color: var(--rouge); font-weight: 600; }

  /* 1 · Couverture */
  .p-couv { color: #fff; }
  .p-couv .cadre { position: absolute; inset: 0; }
  .p-couv .cadre img { object-position: 50% 30%; }
  .p-couv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.7)); }
  .p-couv > *:not(.cadre) { position: absolute; z-index: 2; }
  .p-couv .tete { top: 3cqw; left: 5cqw; right: 5cqw; text-align: center; }
  .p-couv .tete .titre-x { font-size: 30cqw; color: var(--rouge); line-height: .82; font-weight: 700; }
  .p-couv .numero { display: flex; justify-content: space-between; font-size: 2.3cqw; letter-spacing: .1em; text-transform: uppercase; margin-top: 1.4cqw; }
  .p-couv .lignes { left: 5cqw; bottom: 6cqw; right: 40cqw; }
  .p-couv .lignes b { display: block; font-family: var(--titre); font-weight: var(--titre-poids); text-transform: var(--titre-casse); font-size: 7.4cqw; line-height: .98; }
  .p-couv .lignes span { display: block; margin-top: 2.4cqw; font-size: 3cqw; line-height: 1.35; }
  .p-couv .lignes span::before { content: ""; display: inline-block; width: 4cqw; height: .5cqw; background: var(--rouge); vertical-align: .8cqw; margin-right: 1.6cqw; }
  .p-couv .modele { right: 5cqw; bottom: 6cqw; text-align: right; font-size: 2.6cqw; }
  .p-couv .modele em { display: block; font-family: var(--titre); font-style: italic; font-size: 4.6cqw; }

  /* 2 · Sommaire */
  .p-sommaire { padding: 8cqw 6cqw; }
  .p-sommaire .titre-x { font-size: 13cqw; }
  .p-sommaire ol { list-style: none; margin-top: 7cqw; }
  .p-sommaire li { display: grid; grid-template-columns: 9cqw 1fr; gap: 2cqw; padding: 2.6cqw 0; border-top: .25cqw solid var(--encre); }
  .p-sommaire li b { font-family: var(--titre); font-weight: var(--titre-poids); font-size: 6cqw; line-height: 1; color: var(--rouge); }
  .p-sommaire li strong { display: block; font-size: 3.6cqw; font-weight: 600; }
  .p-sommaire li span { display: block; margin-top: .6cqw; font-size: 2.8cqw; color: var(--gris); line-height: 1.4; }
  .p-sommaire .vignette { position: absolute; right: 6cqw; top: 8cqw; width: 26cqw; aspect-ratio: 3 / 4; }

  /* 3 · Édito */
  .p-edito .cadre { height: 50%; }
  .p-edito .texte { padding: 5cqw 6cqw; display: grid; grid-template-columns: 1fr 1fr; gap: 5cqw; }
  .p-edito .titre-x { font-size: 6.6cqw; margin-top: 1.4cqw; }
  .p-edito p { font-size: 2.9cqw; line-height: 1.55; }
  .p-edito p::first-letter { font-family: var(--titre); font-weight: var(--titre-poids); float: left; font-size: 9.6cqw; line-height: .8; padding: .8cqw 1.4cqw 0 0; color: var(--rouge); }

  /* 4 et 5 · Les visages */
  .p-visages { padding: 7cqw 6cqw 10cqw; display: flex; flex-direction: column; }
  .p-visages header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 4cqw; }
  .p-visages .titre-x { font-size: 12cqw; }
  .p-visages .grille { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 2.4cqw 2cqw; min-height: 0; }
  .p-visages figure { display: flex; flex-direction: column; min-height: 0; }
  .p-visages .cadre { flex: 1; min-height: 0; }
  .p-visages figcaption { margin-top: 1.2cqw; font-size: 2.6cqw; font-weight: 500; }
  .p-visages.hommes .grille { grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; }
  .p-visages.hommes figure:first-child { grid-row: span 2; }

  /* 6 · À la une */
  .p-une .cadre { position: absolute; inset: 0; }
  .p-une::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0) 45%); }
  .p-une .bas-une { position: absolute; z-index: 2; left: 6cqw; right: 6cqw; bottom: 8cqw; color: #fff; }
  .p-une .titre-x { font-size: 13cqw; }
  .p-une p { margin-top: 2cqw; font-size: 3cqw; max-width: 60cqw; line-height: 1.45; }
  .p-une .folio { color: rgba(255,255,255,.8); z-index: 2; }

  /* 7 · L'agence */
  .p-agence { padding: 8cqw 6cqw; }
  .p-agence .titre-x { font-size: 11cqw; margin-top: 2cqw; }
  .p-agence ul { list-style: none; margin-top: 6cqw; }
  .p-agence li { display: grid; grid-template-columns: 1fr 1.3fr; gap: 4cqw; padding: 3cqw 0; border-top: .25cqw solid var(--encre); }
  .p-agence li strong { font-family: var(--titre); font-weight: var(--titre-poids); text-transform: var(--titre-casse); font-size: 5cqw; line-height: 1; }
  .p-agence li span { font-size: 2.9cqw; line-height: 1.5; color: var(--gris); }
  .p-agence .cadre { position: absolute; left: 6cqw; right: 6cqw; bottom: 9cqw; height: 30cqw; }

  /* 8 · Dos de couverture */
  .p-dos { background: var(--rouge); color: #fff; padding: 9cqw 7cqw; display: flex; flex-direction: column; }
  .p-dos .rubrique { color: #fff; opacity: .85; }
  .p-dos .titre-x { font-size: 13cqw; margin-top: 3cqw; }
  .p-dos p { margin-top: 4cqw; font-size: 3.2cqw; line-height: 1.5; max-width: 70cqw; }
  .p-dos .cadre { margin-top: auto; height: 46cqw; }
  .p-dos .bouton { display: inline-block; margin-top: 5cqw; align-self: flex-start; background: #fff; color: var(--rouge); padding: 2.6cqw 5cqw; font-size: 3cqw; font-weight: 600; }
  .p-dos .contact { margin-top: 4cqw; font-size: 2.6cqw; opacity: .9; }

  /* ===== Commandes communes ===== */
  .commandes { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 14px 0 90px; font-size: 14px; color: var(--encre); }
  .ed-vogue .commandes, .ed-lookbook .commandes { color: var(--encre); }
  .commandes button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid currentColor; font-size: 18px; }
  .commandes button:disabled { opacity: .3; cursor: default; }
  .aide { text-align: center; font-size: 13px; color: var(--gris); padding-top: 18px; }

  /* ===== 1 · LIVRE : on tourne les pages ===== */
  .livre-scene { display: flex; justify-content: center; padding-top: 18px; perspective: 2600px; overflow: hidden; }
  .livre { position: relative; width: calc(var(--W) * var(--n)); height: calc(var(--W) * 4 / 3); transition: transform .7s cubic-bezier(.3,.7,.2,1); }
  .feuille { position: absolute; top: 0; width: var(--W); height: 100%; transform-origin: left center; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.35,.6,.2,1); }
  .livre.double .feuille { left: 50%; }
  .livre.simple .feuille { left: 0; }
  .feuille > .page { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .feuille > .page.verso { transform: rotateY(180deg); }
  .feuille > .page::before { content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .livre.double .feuille > .page.recto::before { background: linear-gradient(to right, rgba(0,0,0,.18), rgba(0,0,0,0) 7%); }
  .livre.double .feuille > .page.verso::before { background: linear-gradient(to left, rgba(0,0,0,.18), rgba(0,0,0,0) 7%); }
  .feuille.tournee { transform: rotateY(-180deg); }
  .livre.simple .feuille.tournee { transform: rotateY(-100deg); opacity: 0; transition: transform .8s cubic-bezier(.35,.6,.2,1), opacity .3s .5s; }

  /* ===== 2 · GLISSE : les doubles pages glissent ===== */
  .glisse { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-top: 18px; }
  .glisse::-webkit-scrollbar { display: none; }
  .glisse .vue { flex: 0 0 100%; display: flex; justify-content: center; scroll-snap-align: center; }
  .glisse .vue .page { box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .glisse .vue .page + .page { box-shadow: 20px 20px 60px rgba(0,0,0,.6); }
  .progression { height: 2px; width: min(420px, 60vw); margin: 22px auto 0; background: rgba(255,255,255,.18); }
  .progression i { display: block; height: 100%; width: 0; background: var(--rouge); transition: width .3s; }

  /* ===== 3 · PILE : les pages s'empilent en descendant ===== */
  .pile .etage { height: 100vh; position: relative; }
  .pile .etage .page { position: sticky; top: calc(50vh - var(--W) * 2 / 3); margin: 0 auto; box-shadow: 0 -12px 50px rgba(0,0,0,.25); }
  .pile .etage:last-child { height: auto; padding-bottom: 40px; }
  .pile-intro { height: 30vh; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; font-size: 14px; color: var(--gris); }

  /* Sélecteur (ne fait pas partie du design) */
  .choix { position: fixed; z-index: 100; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(28,28,28,.92); box-shadow: 0 6px 24px rgba(0,0,0,.3); font: 500 14px/1 system-ui, sans-serif; }
  .choix button { color: #ddd; padding: 11px 13px; border-radius: 999px; white-space: nowrap; }
  .choix button[aria-pressed="true"] { background: #fff; color: #000; }
  @media (prefers-reduced-motion: reduce) { .feuille, .livre { transition: none !important; } }
</style>

  // Fabrique les 8 pages (copie neuve à chaque appel)
  function pages() {

  function largeurPage(marge) {
