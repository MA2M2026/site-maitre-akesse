<body>
<script async src="../js/filet-reveal.js"></script>



<header class="site-header-v2" data-gabarit="entete" data-page="mannequins"></header>

<div class="menu-overlay" id="menuOverlay" data-gabarit="menu"></div>
<script src="../js/gabarit.js"></script>

<section class="u-pb-1">
  <div class="container">
    <div class="eyebrow reveal">The Agency</div>
    <h1 class="reveal reveal-delay-1">The Book<span class="oeil">.</span></h1>
    <p class="u-mt-1-2 reveal reveal-delay-2">Select the profiles you're interested in for a group casting request.</p>
  </div>
</section>

<section class="u-pt-1">
  <div class="container">
    <div class="filtres reveal">
      <button class="filtre-btn actif" data-cat="tous">All</button>
      <button class="filtre-btn" data-cat="femme">Women</button>
      <button class="filtre-btn" data-cat="homme">Men</button>
    </div>
    <!-- Niveau (06/10/2026) : New Face / Main Board (= « Professionnel » en interne). -->
    <div class="filtres filtres-niveau reveal" role="group" aria-label="Level">
      <button class="filtre-btn filtre-niveau-btn actif" data-niveau="tous">All levels</button>
      <button class="filtre-btn filtre-niveau-btn" data-niveau="New Face">New Face</button>
      <button class="filtre-btn filtre-niveau-btn" data-niveau="Professionnel">Main Board</button>
    </div>

    <div class="filtres-avances reveal">
      <div class="form-champ u-grid-pleine-largeur">
        <label for="f-recherche">Search a model by name</label>
        <input type="text" id="f-recherche" placeholder="e.g. Bolli">
      </div>
      <div class="form-champ">
        <label for="f-taille-min">Min height (cm)</label>
        <input type="number" id="f-taille-min" placeholder="e.g. 170">
      </div>
      <div class="form-champ">
        <label for="f-taille-max">Max height (cm)</label>
        <input type="number" id="f-taille-max" placeholder="e.g. 185">
      </div>
      <div class="form-champ">
        <label for="f-carnation">Skin tone</label>
        <select id="f-carnation">
          <option value="">All</option>
          <option value="Claire">Light</option>
          <option value="Métisse claire">Light mixed</option>
          <option value="Métisse foncée">Dark mixed</option>
          <option value="Foncée">Dark</option>
          <option value="Très foncée">Very dark</option>
        </select>
      </div>
      <div class="form-champ">
        <label for="f-vetements">Clothing size</label>
        <input type="text" id="f-vetements" placeholder="e.g. M, 40">
      </div>
      <div class="form-champ">
        <label for="f-disponibilite">Availability</label>
        <select id="f-disponibilite">
          <option value="">All</option>
          <option value="immediate">Available immediately</option>
          <option value="rdv">By appointment</option>
          <option value="mobile">Available for travel</option>
        </select>
      </div>
    </div>

    <div id="grille" class="medaillon-grille" data-place-reservee></div>
    <p id="vide" class="mannequins-vide u-hidden">No profile matches these criteria.</p>
  </div>
</section>

<footer class="site-footer" data-gabarit="pied"></footer>
