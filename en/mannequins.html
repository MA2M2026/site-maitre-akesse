<body>

<header class="site-header-v2" data-gabarit="entete" data-page="mannequins"></header>

<div class="menu-overlay" id="menuOverlay" data-gabarit="menu"></div>
<script src="../js/gabarit.js?v=66592bb5"></script>

<section class="u-pb-1">
  <div class="container">
    <div class="eyebrow reveal">The Agency</div>
    <h1 class="reveal reveal-delay-1">The Book<span class="oeil">.</span></h1>
    <p class="u-mt-1-2 reveal reveal-delay-2">Select the profiles you're interested in (tap the <strong>+</strong> on a photo) for a group casting request.</p>
  </div>
</section>

<section class="u-pt-1">
  <div class="container">
    <!-- Filtres (14/10/2026, demande de la propriétaire) : catégorie et niveau sur une seule
         ligne ; recherche par mesures, chaque critère utilisable SEUL (js/mannequins.js). -->
    <div class="filtres-ligne reveal">
      <div class="filtres" role="group" aria-label="Category">
        <button class="filtre-btn actif" data-cat="tous">All</button>
        <button class="filtre-btn" data-cat="femme">Women</button>
        <button class="filtre-btn" data-cat="homme">Men</button>
      </div>
      <div class="filtres filtres-niveau" role="group" aria-label="Level">
        <button class="filtre-btn filtre-niveau-btn actif" data-niveau="tous">All levels</button>
        <button class="filtre-btn filtre-niveau-btn" data-niveau="New Face">New Face</button>
        <button class="filtre-btn filtre-niveau-btn" data-niveau="Professionnel">Main Board</button>
      </div>
    </div>

    <!-- Mesures repliables sur téléphone (20/10/2026) : repliées au départ (règle CSS, donc dès le
         premier affichage, sans saut) pour que les profils apparaissent juste sous les boutons ;
         toujours visibles sur ordinateur. Ouverture : js/mannequins.js -->
    <div class="filtres-mesures reveal">
      <button type="button" class="filtres-mesures-bouton" aria-expanded="false" aria-controls="filtres-mesures-champs" data-bouton-libre>Measurements: height, bust, waist, hips, shoes, clothing sizes</button>
      <div class="filtres-avances" id="filtres-mesures-champs">
        <div class="form-champ">
          <label for="f-taille-min">Min height (cm)</label>
          <input type="number" id="f-taille-min" inputmode="numeric" placeholder="e.g. 170">
        </div>
        <div class="form-champ">
          <label for="f-taille-max">Max height (cm)</label>
          <input type="number" id="f-taille-max" inputmode="numeric" placeholder="e.g. 185">
        </div>
        <div class="form-champ">
          <label for="f-poitrine">Bust / chest (cm)</label>
          <input type="number" id="f-poitrine" inputmode="numeric" placeholder="e.g. 86">
        </div>
        <div class="form-champ">
          <label for="f-tour-taille">Waist (cm)</label>
          <input type="number" id="f-tour-taille" inputmode="numeric" placeholder="e.g. 62">
        </div>
        <div class="form-champ">
          <label for="f-bassin">Hips (cm)</label>
          <input type="number" id="f-bassin" inputmode="numeric" placeholder="e.g. 97">
        </div>
        <div class="form-champ">
          <label for="f-pointure">Shoe size (EU)</label>
          <input type="number" id="f-pointure" inputmode="numeric" placeholder="e.g. 39">
        </div>
        <div class="form-champ">
          <label for="f-taille-haut">Top size</label>
          <select id="f-taille-haut"><option value="">All</option><option value="XXS">XXS</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="XXXL">XXXL</option></select>
        </div>
        <div class="form-champ">
          <label for="f-taille-bas">Bottom size</label>
          <select id="f-taille-bas"><option value="">All</option><option value="XXS">XXS</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="XXXL">XXXL</option></select>
        </div>
        <div class="form-champ">
          <label for="f-taille-complete">Full outfit size</label>
          <select id="f-taille-complete"><option value="">All</option><option value="XXS">XXS</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="XXXL">XXXL</option></select>
        </div>
      </div>
    </div>

    <details class="filtres-plus reveal">
      <summary>More criteria: eyes, hair, skin tone, city, language…</summary>
      <div class="filtres-avances">
        <div class="form-champ">
          <label for="f-yeux">Eye colour</label>
          <select id="f-yeux"><option value="">All</option></select>
        </div>
        <div class="form-champ">
          <label for="f-cheveux">Hair colour</label>
          <select id="f-cheveux"><option value="">All</option></select>
        </div>
        <div class="form-champ">
          <label for="f-carnation">Skin tone</label>
          <select id="f-carnation"><option value="">All</option><option value="Claire">Light</option><option value="Métisse claire">Light mixed</option><option value="Métisse foncée">Dark mixed</option><option value="Foncée">Dark</option><option value="Très foncée">Very dark</option></select>
        </div>
        <div class="form-champ">
          <label for="f-ville">City</label>
          <select id="f-ville"><option value="">All</option></select>
        </div>
        <div class="form-champ">
          <label for="f-langue">Language spoken</label>
          <select id="f-langue"><option value="">All</option></select>
        </div>
        <div class="form-champ">
          <label for="f-disponibilite">Availability</label>
          <select id="f-disponibilite"><option value="">All</option><option value="immediate">Available immediately</option><option value="rdv">By appointment</option><option value="mobile">Available to travel</option></select>
        </div>
        <div class="form-champ">
          <label for="f-recherche">Know the name?</label>
          <input type="text" id="f-recherche" placeholder="e.g. Bolli">
        </div>
      </div>
    </details>

    <div class="filtres-bilan" aria-live="polite"><span id="f-compte"></span> <button type="button" class="btn-mini-admin" id="f-effacer" hidden>Clear filters</button></div>
    <p id="f-proches" class="filtres-proches u-hidden"></p>

    <div id="grille" class="medaillon-grille" data-place-reservee></div>
    <p id="vide" class="mannequins-vide u-hidden">No profile matches these criteria.</p>
  </div>
</section>
