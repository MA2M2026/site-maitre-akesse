<script src="https://js-de.sentry-cdn.com/9213fdda0531f437e2c1abd310598a77.min.js" crossorigin="anonymous"></script>

<script async crossorigin="anonymous" src="https://www.googletagmanager.com/gtag/js?id=G-1BX5MPZ6WE"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Selection — Maître Akesse Model Management</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/selection-etat.js"></script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1e1d1c">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<style>
.ense-1 { max-width:760px; }
.ense-2 { display:none; padding:2rem 0; color:var(--gris); }
.ense-3 { color:var(--rouge); font-weight:600; }
.ense-4 { margin:2.5rem 0 1.5rem; }
.ense-5 { margin-bottom:0.5rem; }
.ense-6 { display:none; margin-top:0.5rem; }
.ense-7 { cursor:pointer; }
.ense-8 { padding:3rem 0; text-align:center; }
</style>
</head>
<body>
<script async src="../js/filet-reveal.js"></script>


<header class="site-header-v2" data-gabarit="entete" data-page="selection"></header>

<div class="menu-overlay" id="menuOverlay" data-gabarit="menu"></div>
<script src="../js/gabarit.js"></script>

<section class="u-pb-1">
  <div class="container">
    <div class="eyebrow reveal">Casting Request</div>
    <h1 class="reveal reveal-delay-1">My Selection<span class="oeil">.</span></h1>
    <p class="u-mt-1">Review the profiles you've chosen, then send your request. The agency will contact you directly — your future exchanges with the models will always go through MA2M.</p>
  </div>
</section>

<section class="u-pt-1">
  <div class="container ense-1">
    <div id="liste-vide" class="ense-2">
      No models selected yet. <a href="mannequins.html" class="ense-3">Browse Profiles →</a>
    </div>

    <div id="bloc-selection">
      <div id="selection-liste" class="selection-liste"></div>

      <h2 class="ense-4">Your Details</h2>
      <form id="form-recruteur">
        <div class="form-grille">
          <div class="form-champ">
            <label for="re-entreprise">Company / Brand</label>
            <input type="text" id="re-entreprise">
          </div>
          <div class="form-champ">
            <label for="re-civilite">Title *</label>
            <select id="re-civilite" required><option value="">Select</option><option value="Madame">Mrs</option><option value="Mademoiselle">Miss</option><option value="Monsieur">Mr</option></select>
          </div>
          <div class="form-champ">
            <label for="re-nom">Your Name *</label>
            <input type="text" id="re-nom" required>
          </div>
          <div class="form-champ">
            <label for="re-email">Email *</label>
            <input type="email" id="re-email" required>
          </div>
          <div class="form-champ">
            <label for="re-indicatif">Phone</label>
            <select id="re-indicatif" class="ense-5"></select>
            <input aria-label="Phone — number" type="tel" id="re-telephone-numero" placeholder="07 00 00 00 00">
          </div>
          <div class="form-champ">
            <label for="re-indicatif-whatsapp">WhatsApp</label>
            <select id="re-indicatif-whatsapp" class="ense-5"></select>
            <input aria-label="WhatsApp — number" type="tel" id="re-whatsapp-numero" placeholder="07 00 00 00 00">
          </div>
          <div class="form-champ">
            <label for="re-ville">City</label>
            <select id="re-ville"></select>
            <input aria-label="Specify the city" type="text" id="re-ville-autre" placeholder="Specify the city" class="ense-6">
          </div>
          <div class="form-champ">
            <label for="re-type">Project Type</label>
            <input type="text" id="re-type" placeholder="Shoot, runway show, advertising...">
          </div>
          <div class="form-champ">
            <label for="re-date">Desired Date</label>
            <input type="date" id="re-date">
          </div>
        </div>
        <div class="form-champ">
          <label for="re-message">Additional Information</label>
          <textarea id="re-message"></textarea>
        </div>
        <div class="form-champ form-consentement"><input type="checkbox" id="re-consentement" required><label for="re-consentement">I have read the <a href="politique-confidentialite.html" target="_blank" rel="noopener">privacy policy</a> and agree that my information will be used to process my request. *</label></div>
        <button type="submit" class="btn btn--principal" id="btn-envoyer-recruteur">Send My Selection</button>
        <div id="re-msg" class="form-msg"></div>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer" data-gabarit="pied"></footer>
<script src="../js/gabarit.js"></script>

<script src="../js/copyright-annee.js"></script>

<script src="../js/vendor/emailjs-browser-3.12.1.min.js"></script>
<script src="../js/emailjs-config.js"></script>
<script src="../js/app.js"></script>
<script src="../js/confort.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/selection.js"></script>
<script src="../js/villes-cote-ivoire.js"></script>
<script src="../js/demande-recruteur.js"></script>
</body>
</html>
