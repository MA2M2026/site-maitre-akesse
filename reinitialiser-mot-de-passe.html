<body>
<script>window.MA2M_SESSION_REQUISE = true;</script>

<header class="site-header-v2">
  <div class="container header-v2-inner">
    <a href="index.html" class="logo-img-header"><img src="assets/logo-header.png" alt="Maître Akesse Model Management"></a>
  </div>
</header>

<section class="rmdp-section">
  <div class="container">
    <div class="eyebrow reveal visible">Sécurité du compte</div>
    <h1 class="reveal visible">Nouveau mot de passe<span class="oeil">.</span></h1>

    <div class="rmdp-carte">
      <p id="rmdp-intro" class="form-msg">Vérification du lien en cours…</p>

      <form id="rmdp-form">
        <div class="form-champ">
          <label for="rmdp-mdp">Nouveau mot de passe (8 caractères minimum)</label>
          <input type="password" id="rmdp-mdp" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-champ">
          <label for="rmdp-mdp-confirmer">Confirmer le nouveau mot de passe</label>
          <input type="password" id="rmdp-mdp-confirmer" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--principal">Enregistrer le nouveau mot de passe</button>
        <div id="rmdp-msg" class="form-msg"></div>
      </form>

      <div id="rmdp-liens" class="rmdp-liens">
        <a href="tableau-de-bord.html" class="btn">Aller au tableau de bord</a>
        <a href="espace-mannequin.html" class="btn">Aller à l'espace mannequin</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bas">
      <span>© <span id="an"></span> Maître Akesse Model Management</span>
      <span>Abidjan, Côte d'Ivoire</span>
      <span><a href="mentions-legales.html">Mentions légales</a> · <a href="politique-confidentialite.html">Confidentialité</a></span>
    </div>

<script src="js/copyright-annee.js"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.6/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script>
// Page dédiée, volontairement séparée de tableau-de-bord.html et
// espace-mannequin.html : ces deux pages ont leur propre logique de
// démarrage (vérification de session, chargement du tableau/de l'espace),
// qui entrait en course avec la détection du lien de réinitialisation —
// selon l'ordre d'arrivée des réponses réseau, l'utilisateur atterrissait
// parfois directement dans son espace au lieu de pouvoir changer son mot
// de passe. Une page à usage unique, sans autre logique de démarrage,
// supprime cette course : rien d'autre ne peut lui disputer l'écran.
const intro = document.getElementById('rmdp-intro');
const form = document.getElementById('rmdp-form');
const liens = document.getElementById('rmdp-liens');
const msg = document.getElementById('rmdp-msg');

const lienValide = /type=recovery/.test(window.location.hash + window.location.search);
if (!lienValide) {
  intro.className = 'form-msg err';
  intro.textContent = "Ce lien est invalide ou a déjà été utilisé. Redemandez une réinitialisation depuis l'écran de connexion.";
} else {
  intro.textContent = 'Lien vérifié — choisissez votre nouveau mot de passe ci-dessous.';
  form.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mdp = document.getElementById('rmdp-mdp').value;
  const mdpConfirmer = document.getElementById('rmdp-mdp-confirmer').value;
  const bouton = form.querySelector('button[type="submit"]');

  if (mdp.length < 8) {
    msg.className = 'form-msg err';
    msg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
    msg.style.display = 'block';
    return;
  }
  if (mdp !== mdpConfirmer) {
    msg.className = 'form-msg err';
    msg.textContent = 'Les deux mots de passe ne correspondent pas.';
    msg.style.display = 'block';
    return;
  }

  bouton.disabled = true;
  msg.className = 'form-msg ok';
  msg.textContent = 'Enregistrement…';
  msg.style.display = 'block';

  if (!sb) {
    msg.className = 'form-msg err';
    msg.textContent = 'Service indisponible pour le moment — réessayez dans quelques instants.';
    bouton.disabled = false;
    return;
  }

  const { error } = await sb.auth.updateUser({ password: mdp });
  bouton.disabled = false;

  if (error) {
    msg.className = 'form-msg err';
    msg.textContent = "Erreur : " + error.message + " — le lien a peut-être expiré, redemandez une réinitialisation.";
    msg.style.display = 'block';
    return;
  }

  await sb.auth.signOut();
  form.style.display = 'none';
  intro.className = 'form-msg ok';
  intro.textContent = 'Mot de passe mis à jour ! Vous pouvez maintenant vous reconnecter.';
  liens.style.display = 'flex';
});
</script>
</body>
</html>
