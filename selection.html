<section class="u-pb-1">
  <div class="container">
    <div class="eyebrow reveal">Demande de casting</div>
    <h1 class="reveal reveal-delay-1">Ma sélection<span class="oeil">.</span></h1>
    <p class="u-mt-1">Vérifiez les profils choisis, puis envoyez votre demande. L'agence vous recontacte directement, vos futurs échanges avec les mannequins passeront toujours par MA2M.</p>
  </div>
</section>

<section class="u-pt-1">
  <div class="container se-1">
    <div id="liste-vide" class="se-2">
      Aucun mannequin sélectionné pour l'instant. <a href="mannequins.html" class="se-3">Parcourir les profils →</a>
    </div>

    <div id="bloc-selection">
      <div id="selection-liste" class="selection-liste"></div>

      <h2 class="se-4">Vos coordonnées</h2>
      <form id="form-recruteur">
        <div class="form-grille">
          <div class="form-champ">
            <label for="re-entreprise">Entreprise / marque</label>
            <input type="text" id="re-entreprise">
          </div>
          <div class="form-champ">
            <label for="re-civilite">Civilité *</label>
            <select id="re-civilite" required><option value="">Sélectionner</option><option value="Madame">Madame</option><option value="Mademoiselle">Mademoiselle</option><option value="Monsieur">Monsieur</option></select>
          </div>
          <div class="form-champ">
            <label for="re-nom">Votre nom *</label>
            <input type="text" id="re-nom" required>
          </div>
          <div class="form-champ">
            <label for="re-email">E-mail *</label>
            <input type="email" id="re-email" required>
          </div>
          <div class="form-champ">
            <label for="re-indicatif">Téléphone</label>
            <select id="re-indicatif" class="se-5"></select>
            <input aria-label="Téléphone, numéro" type="tel" id="re-telephone-numero" placeholder="07 00 00 00 00" pattern="[0-9 ]{6,14}">
          </div>
          <div class="form-champ">
            <label for="re-indicatif-whatsapp">WhatsApp</label>
            <select id="re-indicatif-whatsapp" class="se-5"></select>
            <input aria-label="WhatsApp, numéro" type="tel" id="re-whatsapp-numero" placeholder="07 00 00 00 00" pattern="[0-9 ]{6,14}">
          </div>
          <div class="form-champ">
            <label for="re-ville">Ville</label>
            <select id="re-ville"></select>
            <input aria-label="Précisez la ville" type="text" id="re-ville-autre" placeholder="Précisez la ville" class="se-6">
          </div>
          <div class="form-champ">
            <label for="re-type">Type de projet</label>
            <input type="text" id="re-type" placeholder="Shooting, défilé, publicité...">
          </div>
          <div class="form-champ">
            <label for="re-date">Date souhaitée</label>
            <input type="date" id="re-date">
          </div>
        </div>
        <div class="form-champ">
          <label for="re-message">Informations complémentaires</label>
          <textarea id="re-message"></textarea>
        </div>
        <div class="form-champ form-consentement"><input type="checkbox" id="re-consentement" required><label for="re-consentement">J’ai lu la <a href="politique-confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a> et j’accepte que mes informations soient utilisées pour traiter ma demande. *</label></div>
        <button type="submit" class="btn btn--principal" id="btn-envoyer-recruteur">Envoyer ma sélection</button>
        <div id="re-msg" class="form-msg"></div>
      </form>
    </div>
  </div>
</section>
