<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Espace Mannequin — MA2M | Premium</title>
<meta name="theme-color" content="#080707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --noir:#0d0a08;
  --noir-2:#151009;
  --bordeaux:#5c0f1e;
  --bordeaux-2:#7a1626;
  --ivoire:#f4ede1;
  --ivoire-2:#e8ddc9;
  --or:#c9a24a;
  --or-clair:#e4c477;
  --texte-clair:rgba(244,237,225,.72);
  --texte-tres-clair:rgba(244,237,225,.45);
  --ok:#7fae7f;
  --serif:'Cormorant Garamond',serif;
  --sans:'Jost',sans-serif;
  --radius:2px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(92,15,30,.35), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(201,162,74,.08), transparent 55%),
    var(--noir);
  color:var(--ivoire);
  font-family:var(--sans);
  font-weight:300;
  letter-spacing:.01em;
  min-height:100%;
  line-height:1.5;
}
img,svg{max-width:100%}
a{color:inherit}

.demo-banner{background:linear-gradient(90deg,var(--bordeaux-2),var(--bordeaux));color:var(--ivoire);text-align:center;font-size:.7rem;letter-spacing:.04em;padding:9px 14px}
.demo-banner b{color:var(--or-clair)}
.auth-loading{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--texte-clair);font-size:.85rem}
.spinner{width:26px;height:26px;border:2px solid rgba(244,237,225,.2);border-top-color:var(--or);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* ---------- shell ---------- */
.shell{max-width:960px;margin:0 auto;padding:40px 22px 90px}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-bottom:34px;padding-bottom:22px;
  border-bottom:1px solid rgba(201,162,74,.22);
}
.wordmark{display:flex;flex-direction:column;gap:2px}
.wordmark .mark{
  font-family:var(--serif);font-size:1.9rem;letter-spacing:.06em;color:var(--or-clair);
  font-style:italic;font-weight:500;
}
.wordmark .full{font-size:.66rem;letter-spacing:.22em;color:var(--texte-tres-clair);text-transform:uppercase}
.espace-tag{font-size:.72rem;color:var(--texte-clair);letter-spacing:.06em;text-align:right}
.espace-tag b{display:block;font-family:var(--serif);font-style:italic;color:var(--ivoire);font-size:1.15rem;font-weight:500}

/* ---------- greeting card ---------- */
.greet{
  background:linear-gradient(160deg,var(--noir-2),rgba(92,15,30,.25));
  border:1px solid rgba(201,162,74,.28);
  border-radius:var(--radius);
  padding:26px 28px;margin-bottom:30px;
}
.greet h1{font-family:var(--serif);font-weight:500;font-style:italic;font-size:1.7rem;margin:0 0 8px;color:var(--ivoire)}
.greet p{margin:0 0 18px;color:var(--texte-clair);font-size:.92rem;max-width:56ch}
.progress-row{display:flex;align-items:center;gap:14px}
.progress-track{flex:1;height:3px;background:rgba(244,237,225,.12);position:relative;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--bordeaux-2),var(--or));transition:width .5s ease}
.progress-pct{font-size:.78rem;color:var(--or-clair);min-width:3em;text-align:right}

/* ---------- stepper ---------- */
.stepper{display:flex;flex-wrap:wrap;gap:0;margin-bottom:26px;border:1px solid rgba(244,237,225,.1)}
.step-tab{
  flex:1 1 auto;min-width:110px;text-align:center;padding:13px 8px;
  font-size:.72rem;letter-spacing:.04em;color:var(--texte-tres-clair);
  border-right:1px solid rgba(244,237,225,.08);cursor:pointer;position:relative;
  background:transparent;
}
.step-tab:last-child{border-right:none}
.step-tab .n{display:block;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--texte-clair);margin-bottom:2px}
.step-tab.active{background:rgba(201,162,74,.1);color:var(--ivoire)}
.step-tab.active .n{color:var(--or-clair)}
.step-tab.done .n::after{content:'✓';margin-left:4px;color:var(--ok)}
.step-tab.locked{cursor:default;opacity:.4}

/* ---------- panel / card ---------- */
.panel{
  background:var(--noir-2);
  border:1px solid rgba(201,162,74,.2);
  border-radius:var(--radius);
  padding:30px clamp(18px,4vw,38px);
  animation:panelIn .4s ease;
}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.block-edit[style*="display: block"]{animation:panelIn .3s ease}
.panel h2{
  font-family:var(--serif);font-weight:500;font-style:italic;font-size:1.5rem;
  color:var(--ivoire);margin:0 0 4px;
}
.panel .sub{color:var(--texte-tres-clair);font-size:.82rem;margin:0 0 26px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 22px}
.grid.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:620px){.grid,.grid.g3{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:2px}
.field.full{grid-column:1/-1}
.field label{font-size:.72rem;letter-spacing:.05em;color:var(--texte-clair)}
.field label .req{color:var(--or-clair);margin-left:2px}
.field input[type=text],.field input[type=date],.field input[type=tel],.field input[type=email],.field input[type=number],.field select,.field textarea{
  background:rgba(244,237,225,.04);
  border:1px solid rgba(244,237,225,.18);
  border-radius:var(--radius);
  color:var(--ivoire);
  padding:11px 12px;
  font-family:var(--sans);font-size:.92rem;font-weight:300;
  outline:none;transition:border-color .2s, background .2s;
}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--or);background:rgba(201,162,74,.06);
}
.field input::placeholder,.field textarea::placeholder{color:var(--texte-tres-clair)}
.field.invalid input,.field.invalid select{border-color:var(--bordeaux-2);background:rgba(122,22,38,.12)}
.err-msg{font-size:.7rem;color:#d98a92;min-height:1em}

.radio-row,.check-row{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:2px}
.radio-opt,.check-opt{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--texte-clair);cursor:pointer}
.radio-opt input,.check-opt input{accent-color:var(--or);width:16px;height:16px;cursor:pointer}
.radio-opt.selected,.check-opt.selected{color:var(--ivoire)}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--sans);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;
  padding:13px 26px;border-radius:var(--radius);border:1px solid var(--or);
  background:transparent;color:var(--or-clair);cursor:pointer;transition:all .25s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:rgba(201,162,74,.12)}
.btn.primary{background:linear-gradient(120deg,var(--bordeaux-2),var(--bordeaux));border-color:var(--bordeaux-2);color:var(--ivoire)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:rgba(244,237,225,.25);color:var(--texte-clair)}
.btn.ghost:hover{border-color:var(--ivoire);color:var(--ivoire);background:rgba(244,237,225,.05)}
.btn.small{padding:8px 16px;font-size:.68rem}
.btn.saved{border-color:var(--ok);color:var(--ok);background:rgba(127,174,127,.1)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block-btn{width:100%;justify-content:center}
.actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px}
.actions-row.end{justify-content:flex-end}

/* ---------- experiences ---------- */
.exp-card{
  border:1px solid rgba(244,237,225,.15);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:14px;align-items:center;
}
.exp-fields{display:grid;grid-template-columns:150px 1fr 130px 90px;gap:10px;flex:1}
@media(max-width:680px){.exp-fields{grid-template-columns:1fr 1fr}}
.exp-fields select,.exp-fields input{
  background:rgba(244,237,225,.04);border:1px solid rgba(244,237,225,.18);border-radius:var(--radius);
  color:var(--ivoire);padding:9px 10px;font-family:var(--sans);font-size:.84rem;font-weight:300;outline:none;
  transition:border-color .2s, background .2s;
}
.exp-fields select:focus,.exp-fields input:focus{border-color:var(--or);background:rgba(201,162,74,.06)}
.exp-fields input::placeholder{color:var(--texte-tres-clair)}
.exp-remove{background:none;border:none;color:var(--texte-tres-clair);cursor:pointer;font-size:.72rem;text-decoration:underline}
.exp-remove:hover{color:#d98a92}
.exp-empty{color:var(--texte-tres-clair);font-size:.85rem;font-style:italic;padding:14px 0}
.type-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.type-chip{border:1px solid rgba(244,237,225,.2);color:var(--texte-clair);font-size:.72rem;padding:6px 12px;border-radius:20px}

/* ---------- upload zones ---------- */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:620px){.upload-grid{grid-template-columns:1fr}}
.upload-box{
  border:1px dashed rgba(201,162,74,.45);border-radius:var(--radius);
  aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:rgba(244,237,225,.03);cursor:pointer;text-align:center;padding:14px;position:relative;overflow:hidden;
  transition:border-color .2s,background .2s;
}
.upload-box:hover{border-color:var(--or);background:rgba(201,162,74,.06)}
.upload-box.filled{border-style:solid}
.upload-box .ic{font-size:1.6rem;color:var(--or-clair)}
.upload-box .lbl{font-size:.78rem;color:var(--texte-clair)}
.upload-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upload-box .lbl-over{position:relative;z-index:1;background:rgba(13,10,8,.6);padding:4px 8px;border-radius:2px}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:520px){.book-grid{grid-template-columns:repeat(2,1fr)}}
.book-thumb-remove{position:absolute;top:6px;right:6px;background:rgba(13,10,8,.8);border:1px solid rgba(244,237,225,.3);color:var(--ivoire);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.7rem;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.book-thumb-remove:hover{border-color:#d98a92;color:#d98a92}
.book-add{
  aspect-ratio:3/4;border-radius:var(--radius);border:1px dashed rgba(201,162,74,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;color:var(--or-clair);font-size:1.4rem;background:rgba(244,237,225,.03);
  transition:border-color .2s, background .2s;
}
.book-add:hover{border-color:var(--or);background:rgba(201,162,74,.07)}
.book-add span{font-size:.68rem;letter-spacing:.03em;color:var(--texte-clair)}
.cc-counter{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--texte-clair);margin:0 0 22px}
.cc-counter b{color:var(--or-clair);font-family:var(--sans);font-weight:500}
.cc-counter.full b{color:var(--ok)}
.book-thumb{
  aspect-ratio:3/4;border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(122,22,38,.3),rgba(201,162,74,.08));
  border:1px solid rgba(244,237,225,.14);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  font-size:1.2rem;color:var(--texte-tres-clair);
}
.book-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compcard-check{position:absolute;bottom:6px;right:6px;background:rgba(13,10,8,.75);border-radius:3px;padding:3px 6px;font-size:.62rem;display:flex;align-items:center;gap:4px;color:var(--texte-clair);z-index:2}
.compcard-check input{accent-color:var(--or);width:12px;height:12px}
.doc-row{display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(244,237,225,.14);border-radius:var(--radius);padding:13px 16px;margin-bottom:10px;font-size:.86rem}
.doc-row .name{color:var(--texte-clair)}
.doc-row .status-ok{color:var(--ok);font-size:.72rem;margin-left:8px}

/* ---------- recap ---------- */
.recap-block{border:1px solid rgba(244,237,225,.14);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.recap-block .lbl{font-size:.68rem;letter-spacing:.08em;color:var(--or-clair);text-transform:uppercase;margin-bottom:4px}
.recap-block .val{color:var(--texte-clair);font-size:.9rem}
.recap-link{background:none;border:none;color:var(--texte-tres-clair);font-size:.72rem;text-decoration:underline;cursor:pointer;white-space:nowrap}
.recap-link:hover{color:var(--or-clair)}
.visible-toggle{display:flex;align-items:flex-start;gap:12px;margin:24px 0;padding:16px;border:1px solid rgba(201,162,74,.3);border-radius:var(--radius);background:rgba(201,162,74,.05)}
.visible-toggle input{margin-top:3px;accent-color:var(--or);width:16px;height:16px}
.visible-toggle p{margin:0;font-size:.85rem;color:var(--texte-clair)}

/* ---------- confirmation ---------- */
.confirm{text-align:center;padding:50px 20px}
.confirm .check{
  width:64px;height:64px;border-radius:50%;border:1px solid var(--or);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  font-size:1.6rem;color:var(--or-clair);
}
.confirm.refuse .check{border-color:#d98a92;color:#d98a92}
.confirm h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.7rem;margin:0 0 10px}
.confirm p{color:var(--texte-clair);max-width:44ch;margin:0 auto 22px;font-size:.9rem}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:20px;border:1px solid var(--or);color:var(--or-clair)}
.status-pill.online{border-color:var(--ok);color:var(--ok)}
.status-pill.refuse{border-color:#d98a92;color:#d98a92}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- dashboard (post-validation) ---------- */
.online-banner{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:var(--ok);font-size:.8rem;letter-spacing:.05em}
.blocks-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.blocks-grid{grid-template-columns:1fr}}
.block-card{border:1px solid rgba(244,237,225,.16);border-radius:var(--radius);padding:20px;transition:border-color .2s}
.block-card:hover{border-color:rgba(201,162,74,.4)}
.block-card .ic{font-size:1.3rem;margin-bottom:8px;display:block}
.block-card h3{font-family:var(--serif);font-style:italic;font-weight:500;margin:0 0 6px;font-size:1.15rem}
.block-card p{font-size:.78rem;color:var(--texte-tres-clair);margin:0 0 14px;min-height:2.2em}
.block-edit{margin-top:18px;padding-top:18px;border-top:1px dashed rgba(244,237,225,.2)}
.block-edit .btn.save-block{display:none}
.block-edit.dirty .btn.save-block{display:inline-flex}
.cv-cta{margin-top:26px;padding:22px;border:1px solid rgba(201,162,74,.35);border-radius:var(--radius);background:linear-gradient(150deg,rgba(92,15,30,.3),transparent);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cv-cta .txt h3{font-family:var(--serif);font-style:italic;font-weight:500;margin:0 0 4px;font-size:1.2rem}
.cv-cta .txt p{margin:0;font-size:.78rem;color:var(--texte-tres-clair)}
.lock-note{font-size:.68rem;color:var(--texte-tres-clair);margin-top:26px;text-align:center;letter-spacing:.03em}

/* ---------- admin simulation panel (DEMO uniquement) ---------- */
.admin-sim{
  position:fixed;left:16px;bottom:16px;z-index:60;
  background:rgba(13,10,8,.92);border:1px solid var(--or);border-radius:var(--radius);
  padding:14px 16px;max-width:250px;backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.admin-sim h4{margin:0 0 4px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or-clair)}
.admin-sim p{margin:0 0 10px;font-size:.72rem;color:var(--texte-tres-clair)}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--noir-2);border:1px solid var(--ok);color:var(--ivoire);padding:11px 18px;border-radius:var(--radius);font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .25s ease}
.toast.err{border-color:#d98a92}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- CV / compcard overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,4,3,.88);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px calc(30px + env(safe-area-inset-bottom,0px))}
.overlay.hidden{display:none}
.overlay-close{position:sticky;top:0;display:flex;justify-content:flex-end;max-width:900px;margin:0 auto 10px;width:100%}
.overlay-close button{background:none;border:1px solid rgba(244,237,225,.3);color:var(--ivoire);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:.95rem}
.cv-sheet{
  width:100%;max-width:900px;background:var(--ivoire);color:#241a12;border-radius:2px;overflow:hidden;
  font-family:var(--sans);
}
.cv-actions{padding:18px clamp(20px,5vw,40px) 0;display:flex;gap:10px;justify-content:flex-end}
.private-note{background:#2c1116;color:#f0d3d7;font-size:.72rem;padding:10px 16px;text-align:center;letter-spacing:.03em}

/* ---------- MODEL CV — deux colonnes ---------- */
.mcv-wrap{display:flex;align-items:stretch}
@media(max-width:700px){.mcv-wrap{flex-direction:column}}
.mcv-side{
  width:300px;flex-shrink:0;background:linear-gradient(175deg,#141010,var(--noir) 55%);
  color:var(--ivoire);padding:0 0 26px;display:flex;flex-direction:column;
}
@media(max-width:700px){.mcv-side{width:100%}}
.mcv-photo{
  aspect-ratio:3/4;background:linear-gradient(160deg,#3a3632,#0d0a08 75%);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.mcv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.mcv-photo svg{width:34%;opacity:.28;position:relative;z-index:1}
.mcv-photo::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(13,10,8,.55) 0%,transparent 30%,transparent 62%,rgba(13,10,8,.6) 100%)}
.mcv-photo-logo{position:absolute;top:16px;left:16px;z-index:2;color:var(--ivoire)}
.mcv-photo-logo b{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.35rem;letter-spacing:.03em}
.mcv-photo-logo small{display:block;font-size:.48rem;letter-spacing:.14em;color:var(--texte-tres-clair);line-height:1.35;margin-top:2px}
.mcv-tagline{font-size:.6rem;letter-spacing:.28em;color:var(--or-clair);text-align:center;padding:16px 10px 4px;text-transform:uppercase}
.mcv-name{padding:2px 22px 6px}
.mcv-nom{display:block;font-size:1.7rem;font-weight:600;letter-spacing:.04em;color:var(--ivoire)}
.mcv-prenom{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:2rem;color:var(--or-clair);margin-top:-2px}
.mcv-role{padding:0 22px 14px;font-size:.68rem;letter-spacing:.18em;color:var(--texte-clair);text-transform:uppercase}
.mcv-divider{height:1px;background:linear-gradient(90deg,var(--bordeaux-2),transparent);margin:0 22px 16px}
.mcv-info-list{list-style:none;margin:0;padding:0 22px;display:flex;flex-direction:column;gap:14px}
.mcv-info-list li{display:flex;gap:11px;align-items:flex-start}
.mcv-info-list svg{flex-shrink:0;width:16px;height:16px;margin-top:2px;color:var(--or-clair)}
.mcv-info-list .k{display:block;font-size:.6rem;letter-spacing:.06em;color:var(--texte-tres-clair);text-transform:uppercase}
.mcv-info-list .v{display:block;font-size:.82rem;color:var(--ivoire);line-height:1.4}

<body>

<div class="shell" id="app">
  <div class="auth-loading"><div class="spinner"></div><span>Chargement de votre espace…</span></div>
</div>
<div class="toast-wrap" id="toasts"></div>

<div class="overlay hidden" id="overlay"><div id="overlayContent"></div></div>

<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.6/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="js/app.js"></script>
<script>
/* =========================================================================
   ESPACE MANNEQUIN — MA2M — PREMIUM 20
   Interface Premium 20 (wizard en 6 étapes + tableau de bord post-validation),
   connectée aux vraies tables/colonnes/fonctions Supabase de l'agence — pas
   de table ni de colonne inventée, pas de mode démo, pas de donnée simulée.
   Le "vrai" schéma est celui de supabase-setup.sql / supabase-extension.sql,
   déjà utilisé par espace-mannequin.html (conservé en parallèle comme filet
   de sécurité pendant la mise au point de ce fichier).
   ========================================================================= */

/* ---------------------------------------------------------------- ÉTAT --- */
let currentUser = null;

function emptyState(){
  return {
    meta:{
      currentStep:1, editBlock:null, activeCompcardSlot:1,
      // Dérivés à l'affichage à partir des vraies colonnes (published /
      // en_attente_validation / raison_refus / premiere_publication_faite) —
      // jamais écrits tels quels en base, voir deriverStatutAffichage().
      statutAffichage:'brouillon', premierePublicationFaite:false, commentaireAdmin:''
    },
    identite:{ nomComplet:'', dateNaissance:'', lieuNaissance:'', nationalite:'', ville:'', telephone:'', email:'', sexe:'' },
    physique:{
      taille:'', poids:'', poitrine:'', tourTaille:'', hanches:'', entrejambe:'', pointure:'',
      tailleVet:'', yeux:'', cheveux:'', carnation:''
    },
    formation:{ niveau:'', etablissement:'', particuliere:'', mannequin:'' },
    // Années d'expérience / type de modèle / langues / disponibilité — sert
    // uniquement à déduire automatiquement New Face/Amateur/Professionnel
    // (voir deriverNiveauMannequin) : jamais redemandé comme catégorie manuelle.
    profilPro:{ anneesExperience:'', disponibilite:'', modelTypes:[], langues:[] },
    experiences:[],
    photos:{ principale:null, photoCv:null, pleinPied:null, book:[] },
    competences:{},
    citation:'',
    bio:'',
    instagram:''
  };
}
let state = emptyState();

function toNum(v){ const n = parseInt(v, 10); return (v===''||v===null||v===undefined||isNaN(n)) ? null : n; }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

/* --- Niveau New Face / Amateur / Professionnel : jamais demandé au
   mannequin, toujours déduit de years_experience (identique à la logique
   déjà en production dans espace-mannequin.html). --- */
function deriverNiveauMannequin(anneesExperience){
  const annees = anneesExperience===''||anneesExperience===null||anneesExperience===undefined ? NaN : parseInt(anneesExperience,10);
  if (isNaN(annees) || annees===0) return 'New Face';
  if (annees<=2) return 'Amateur';
  return 'Professionnel';
}

/* --- Mode guidé (première inscription) vs mode autonome (blocs indépendants)
   identique à la logique déjà en production : une fois premiere_publication_faite
   passé à true par le trigger serveur, c'est définitif — le mannequin garde
   toujours accès au tableau de bord (jamais reverrouillé derrière un écran
   "en attente"/"refusé"), seuls les bandeaux d'état changent. --- */
function deriverStatutAffichage(profil){
  if (profil.published) return 'valide';
  if (profil.en_attente_validation) return 'en_attente';
  if (!profil.published && !profil.en_attente_validation && profil.raison_refus) return 'refuse';
  return 'brouillon';
}

/* ------------------------------------------------------------- TOASTS --- */
function toast(msg, isErr){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* --------------------------------------------------------- AUTH RÉELLE ---
   Même flux que espace-mannequin.html : inscription avec code d'invitation
   (check_invite_code / consume_invite_code), connexion, récupération de
   mot de passe. Aucune redirection vers une page de connexion séparée —
   tout se passe sur cette page, comme sur l'ancien espace mannequin. */
let recuperationMdpEnCours = false;

function viewAuthGate(){
  return '<div class="top"><div class="wordmark"><span class="mark">MA2M</span><span class="full">Maître Akessé Model Management</span></div></div>' +
  '<div class="panel" id="authPanel">' +
    '<div id="auth-onglets" style="display:flex;gap:10px;margin-bottom:24px">' +
      '<button type="button" class="btn small" id="auth-tab-connexion" data-auth-tab="connexion">Se connecter</button>' +
      '<button type="button" class="btn ghost small" id="auth-tab-inscription" data-auth-tab="inscription">Créer mon compte</button>' +
    '</div>' +
    '<div id="auth-panneau-connexion">' +
      '<h2>Connexion</h2><p class="sub">Accédez à votre espace mannequin.</p>' +
      '<div class="grid">' + field('E-mail','au-co-email','',{type:'email',req:true}) + field('Mot de passe','au-co-mdp','',{type:'password',req:true}) + '</div>' +
      '<div class="actions-row end"><button class="btn primary" id="au-co-valider">Se connecter</button></div>' +
      '<div id="au-co-msg" class="err-msg" style="margin-top:10px"></div>' +
      '<p style="margin-top:14px"><a href="#" id="au-mdp-oublie-lien" style="color:var(--or-clair)">Mot de passe oublié ?</a></p>' +
    '</div>' +
    '<div id="auth-panneau-inscription" style="display:none">' +
      '<h2>Créer mon compte</h2><p class="sub">Un code d’invitation vous a été fourni par l’agence.</p>' +
      '<div class="grid">' +
        field('Code d’invitation','au-in-code','',{req:true}) + field('Nom complet','au-in-nom','',{req:true}) +
        field('E-mail','au-in-email','',{type:'email',req:true}) + field('Mot de passe (6 caractères min.)','au-in-mdp','',{type:'password',req:true}) +
      '</div>' +
      '<div class="actions-row end"><button class="btn primary" id="au-in-valider">Créer mon compte</button></div>' +
      '<div id="au-in-msg" class="err-msg" style="margin-top:10px"></div>' +
    '</div>' +
    '<div id="auth-panneau-mdp-oublie" style="display:none">' +
      '<h2>Mot de passe oublié</h2><p class="sub">Indiquez votre e-mail — si un compte y est associé, un lien de réinitialisation vous sera envoyé.</p>' +
      field('E-mail','au-mo-email','',{type:'email'}) +
      '<div class="actions-row end"><button class="btn primary" id="au-mo-envoyer">Envoyer le lien</button></div>' +
      '<div id="au-mo-msg" class="err-msg" style="margin-top:10px"></div>' +
      '<p style="margin-top:14px"><a href="#" id="au-mo-retour" style="color:var(--or-clair)">← Retour à la connexion</a></p>' +
    '</div>' +
    '<div id="auth-panneau-nouveau-mdp" style="display:none">' +
      '<h2>Nouveau mot de passe</h2><p class="sub">Choisissez votre nouveau mot de passe (8 caractères minimum).</p>' +
      field('Nouveau mot de passe','au-nm-mdp','',{type:'password'}) +
      '<div class="actions-row end"><button class="btn primary" id="au-nm-valider">Valider</button></div>' +
      '<div id="au-nm-msg" class="err-msg" style="margin-top:10px"></div>' +
    '</div>' +
  '</div>';
}

function afficherPanneauAuth(id){
  ['auth-panneau-connexion','auth-panneau-inscription','auth-panneau-mdp-oublie','auth-panneau-nouveau-mdp'].forEach(function(p){
    const el = document.getElementById(p); if (el) el.style.display = (p===id) ? '' : 'none';
  });
}

function bindAuthGate(){
  document.getElementById('auth-tab-connexion')?.addEventListener('click', function(){ afficherPanneauAuth('auth-panneau-connexion'); });
  document.getElementById('auth-tab-inscription')?.addEventListener('click', function(){ afficherPanneauAuth('auth-panneau-inscription'); });

  document.getElementById('au-co-valider')?.addEventListener('click', async function(){
    const msg = document.getElementById('au-co-msg');
    const email = val('au-co-email').trim(), mdp = val('au-co-mdp');
    const { error } = await sb.auth.signInWithPassword({ email, password: mdp });
    if (error) { msg.textContent = 'E-mail ou mot de passe incorrect.'; return; }
    msg.textContent = '';
    await demarrerApresConnexion();
  });

  document.getElementById('au-in-valider')?.addEventListener('click', async function(){
    const msg = document.getElementById('au-in-msg');
    const code = val('au-in-code').trim(), nom = val('au-in-nom').trim(), email = val('au-in-email').trim(), mdp = val('au-in-mdp');
    msg.textContent = 'Vérification du code…';

    const { data: codeValide, error: erreurCode } = await sb.rpc('check_invite_code', { code_input: code });
    if (erreurCode || !codeValide) { msg.textContent = "Ce code d'invitation est invalide ou déjà utilisé."; return; }

    const { data: signUpData, error: erreurSignUp } = await sb.auth.signUp({ email, password: mdp });
    if (erreurSignUp) { msg.textContent = "Erreur lors de la création du compte : " + erreurSignUp.message; return; }

    if (!signUpData.session) {
      msg.textContent = "Compte créé. Vérifiez votre boîte e-mail pour confirmer votre adresse avant de vous connecter.";
      return;
    }

    const { data: consomme, error: erreurConsomme } = await sb.rpc('consume_invite_code', { code_input: code });
    if (erreurConsomme || !consomme) {
      msg.textContent = "Ce code vient d'être utilisé par quelqu'un d'autre. Contactez l'agence pour un nouveau code.";
      await sb.auth.signOut();
      return;
    }

    // Filet de sécurité identique à l'ancien système : s'assurer que la fiche
    // model_profiles existe bien avant de continuer, avec quelques tentatives.
    let erreurProfil = null;
    for (let essai = 0; essai < 3; essai++) {
      const { error } = await sb.from('model_profiles').upsert({ id: signUpData.user.id, full_name: nom, published: false });
      erreurProfil = error;
      if (!error) break;
      await new Promise(function(r){ setTimeout(r, 1000); });
    }
    if (erreurProfil) {
      msg.textContent = "Compte créé, mais la fiche profil n'a pas pu être créée (" + erreurProfil.message + "). Reconnectez-vous pour réessayer, ou contactez l'agence.";
      return;
    }

    msg.textContent = '';
    toast('Compte créé avec succès !');
    await demarrerApresConnexion();
  });

  document.getElementById('au-mdp-oublie-lien')?.addEventListener('click', function(e){
    e.preventDefault();
    document.getElementById('au-mo-email').value = val('au-co-email');
    afficherPanneauAuth('auth-panneau-mdp-oublie');
  });
  document.getElementById('au-mo-retour')?.addEventListener('click', function(e){ e.preventDefault(); afficherPanneauAuth('auth-panneau-connexion'); });
  document.getElementById('au-mo-envoyer')?.addEventListener('click', async function(){
    const email = val('au-mo-email').trim(); const msg = document.getElementById('au-mo-msg');
    if (!email) return;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    msg.textContent = error ? ("Erreur lors de l'envoi : " + error.message) : "Si cet e-mail est associé à un compte, un lien de réinitialisation vient d'être envoyé.";
  });

  document.getElementById('au-nm-valider')?.addEventListener('click', async function(){
    const nouveauMdp = val('au-nm-mdp'); const msg = document.getElementById('au-nm-msg');
    if (nouveauMdp.length < 8) { msg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return; }
    const { error } = await sb.auth.updateUser({ password: nouveauMdp });
    if (error) { msg.textContent = 'Erreur : ' + error.message; return; }
    recuperationMdpEnCours = false;
    await demarrerApresConnexion();

function identiteToDb(d){

function physiqueToDb(p){

    waist_cm: toNum(p.tourTaille), hips_cm: toNum(p.hanches), inseam_cm: toNum(p.entrejambe),

function formationToDb(f){

}
function profilProToDb(pp){

  };

/* Champ "sexe" (femme/homme) déjà utilisé par tout le reste du site pour
   déterminer Hanches vs Entrejambe — on garde son vocabulaire (category),
   jamais celui, différent, de "Newface/Amateur/Pro" qui lui n'est jamais
   stocké : ce niveau est purement calculé à l'affichage. */
function mapProfileFromDb(row, contactPrive){
  const s = emptyState();
  if (!row) return s;
  s.meta.statutAffichage = deriverStatutAffichage(row);
  s.meta.premierePublicationFaite = !!row.premiere_publication_faite;
  s.meta.commentaireAdmin = row.raison_refus || '';
  Object.assign(s.identite, {
    nomComplet: row.full_name || '', dateNaissance: row.date_naissance || '', lieuNaissance: row.lieu_naissance || '',
    nationalite: row.nationalite || '', ville: row.city || '',
    telephone: (contactPrive && contactPrive.phone) || '', email: (contactPrive && contactPrive.contact_email) || '',
    sexe: row.category || ''
  });
  Object.assign(s.physique, {
    taille: row.height_cm ?? '', poids: row.weight_kg ?? '', poitrine: row.chest_cm ?? '', tourTaille: row.waist_cm ?? '',
    hanches: row.hips_cm ?? '', entrejambe: row.inseam_cm ?? '', pointure: row.shoe_size || '', tailleVet: row.clothing_size || '',
    yeux: row.eye_color || '', cheveux: row.hair_color || '', carnation: row.carnation || ''
  });
  Object.assign(s.formation, {
    niveau: row.niveau_etude || '', etablissement: row.etablissement || '', particuliere: row.formation_particuliere || '', mannequin: row.formation_mannequin || ''
  });
  Object.assign(s.profilPro, {
    anneesExperience: row.years_experience ?? '', disponibilite: row.availability || '',
    modelTypes: row.model_types || [], langues: (row.languages || '').split(',').map(function(l){return l.trim();}).filter(Boolean)
  });
  s.competences = row.competences || {};
  s.citation = row.citation || '';
  s.bio = row.bio || '';
  s.instagram = row.instagram || '';
  return s;
}

/* ---------------------------------------------------------- UTILS PHOTOS ---
   Repris à l'identique de espace-mannequin.html (même comportement, même
   pipeline HEIC/compression/miniatures) — voir README-TECHNIQUE.md. */
async function convertirSiHeic(fichier){
  const estHeic = /image\/hei(c|f)/i.test(fichier.type) || /\.(heic|heif)$/i.test(fichier.name);
  if (!estHeic || typeof heic2any === 'undefined') return fichier;
  try{
    const resultat = await heic2any({ blob: fichier, toType: 'image/jpeg', quality: 0.85 });
    const blobFinal = Array.isArray(resultat) ? resultat[0] : resultat;
    return new File([blobFinal], fichier.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
  }catch(e){ console.error('Conversion HEIC échouée, envoi du fichier original :', e); return fichier; }
}
function compresserPhotoOrigine(fichier, coteMax, qualite){
  coteMax = coteMax || 3000; qualite = qualite || 0.90;
  return new Promise(function(resolve){
    if (fichier.type !== 'image/jpeg' || fichier.size < 900*1024) { resolve(fichier); return; }
    const img = new Image();
    img.onload = function(){
      try{
        const coteActuel = Math.max(img.width, img.height);
        const ratio = coteActuel > coteMax ? coteMax/coteActuel : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(function(blob){
          if (!blob || blob.size >= fichier.size) { resolve(fichier); return; }
          resolve(new File([blob], fichier.name.replace(/\.\w+$/, '.jpg'), { type:'image/jpeg' }));
        }, 'image/jpeg', qualite);
      }catch(e){ resolve(fichier); }
    };
    img.onerror = function(){ resolve(fichier); };
    img.src = URL.createObjectURL(fichier);
  });
}
function genererMiniature(fichier, coteMax, qualite){
  coteMax = coteMax || 500; qualite = qualite || 0.75;
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){
      try{
        const coteActuel = Math.max(img.width, img.height);
        const ratio = coteActuel > coteMax ? coteMax/coteActuel : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(function(blob){ resolve(blob||null); }, 'image/jpeg', qualite);
      }catch(e){ resolve(null); }
    };
    img.onerror = function(){ resolve(null); };
    img.src = URL.createObjectURL(fichier);
  });
}

const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function formaterPeriode(valeur){
  if (!valeur) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(valeur);
  if (m) { const mois = MOIS_FR[parseInt(m[2],10)-1]; return mois ? (parseInt(m[3],10)+' '+mois+' '+m[1]) : valeur; }
  const m2 = /^(\d{4})-(\d{2})$/.exec(valeur);
  if (m2) { const mois = MOIS_FR[parseInt(m2[2],10)-1]; return mois ? (mois.charAt(0).toUpperCase()+mois.slice(1)+' '+m2[1]) : valeur; }
  return valeur;
}

function stepComplete(n){
  if (n===1) return !!(state.identite.nomComplet && state.identite.dateNaissance && state.identite.sexe);
  if (n===2) return !!(state.physique.taille && state.physique.poids);
  if (n===3) return !!state.formation.niveau;
  if (n===4) return state.experiences.length>0;
  if (n===5) return !!(state.photos.principale && state.photos.book.length);
  return false;
}

function viewWizard(){
  const pct = Math.round(((state.meta.currentStep-1)/6)*100 + (stepComplete(state.meta.currentStep)?100/6:0));
  const clamped = Math.min(100, Math.max(0,pct));
  return header() +
  '<div class="greet"><h1>Bonjour ' + echapperHtml((state.identite.nomComplet||'').split(' ')[0]||'') + '</h1>' +
  '<p>Complétez votre profil professionnel pour permettre à l’agence de créer votre dossier mannequin. Chaque étape s’enregistre au fur et à mesure — vous pouvez y revenir à tout moment avant l’envoi final.</p>' +
  '<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:'+clamped+'%"></div></div>' +
  '<div class="progress-pct">'+clamped+'%</div></div></div>' +
  '<div class="stepper">' + STEP_LABELS.map(function(l,i){
    const n=i+1; const cls = n===state.meta.currentStep?'active':(stepComplete(n)?'done':'');
    return '<button type="button" class="step-tab '+cls+'" data-goto="'+n+'"><span class="n">'+['①','②','③','④','⑤','⑥'][i]+'</span>'+l+'</button>';
  }).join('') + '</div>' +
  '<div class="panel">' + stepContent(state.meta.currentStep) + '</div>';
}

function stepContent(n){
  if (n===1) return stepIdentite();
  if (n===2) return stepPhysique();
  if (n===3) return stepFormation();
  if (n===4) return stepExperience();
  if (n===5) return stepPhotos();

}

    const btn = this;
    Object.assign(s.physique, {

      yeux: val('f-yeux'), cheveux: val('f-cheveux'), carnation: val('f-carnation')
    });
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const ok = await Store.saveBlock(physiqueToDb(s.physique));
    if (ok) { toast('Enregistré'); goto(3); } else { btn.disabled=false; btn.textContent='Enregistrer'; }
  });

  document.getElementById('save3')?.addEventListener('click', async function(){
    const btn = this;
    s.formation.niveau = val('f-niveau'); s.formation.etablissement = val('f-etab');
    s.formation.particuliere = val('f-formPart'); s.formation.mannequin = val('f-formMannequin');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const ok = await Store.saveBlock(formationToDb(s.formation));
    if (ok) { toast('Enregistré'); goto(4); } else { btn.disabled=false; btn.textContent='Enregistrer'; }

  bindProfilProHandlers();

      toast(resultat.published ? 'Profil publié avec succès.' : 'Profil soumis à MA2M pour validation.');
    }
  });

function bindExperienceHandlers(){
  const s = state;
  document.getElementById('addExp')?.addEventListener('click', async function(){
    const draft = { type:'Défilé', nom:'', lieu:'', annee:new Date().getFullYear().toString() };
    const saved = await Store.addExperience(draft);
    if (saved) { s.experiences.push(saved); render(); }
  });
  document.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click', async function(){
    const i = parseInt(b.dataset.rm,10); const exp = s.experiences[i];
    const ok = await Store.removeExperience(exp.id);
    if (ok) { s.experiences.splice(i,1); render(); }
  }); });
  document.querySelectorAll('[data-expf]').forEach(function(el){
    const eventName = el.tagName==='SELECT' ? 'change' : 'input';
    let debounceTimer;
    el.addEventListener(eventName, function(){
      const i = parseInt(el.dataset.i,10);
      s.experiences[i][el.dataset.expf] = el.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function(){ Store.updateExperience(s.experiences[i].id, s.experiences[i]); }, 500);
    });
  });
}

/* ------------------------------------------------------- PHOTOS : handlers */
function bindPhotoHandlers(){
  const s = state;
  const fBook = document.getElementById('fBook');
  if (fBook) fBook.addEventListener('change', async function(){
    const files = Array.from(fBook.files||[]);
    if (!files.length) return;
    if (files.length>1) toast(files.length+' photos en cours d’envoi…');
    for (const file of files) { const item = await Store.uploadPhoto(file); if (item) s.photos.book.push(item); }
    fBook.value=''; render(); reopenDashboardBlock('photos');
  });
  document.querySelectorAll('[data-rmbook]').forEach(function(b){ b.addEventListener('click', async function(e){
    e.stopPropagation();
    const id = b.dataset.rmbook; const photo = s.photos.book.find(function(ph){ return String(ph.id)===String(id); });
    if (!photo) return;
    const ok = await Store.removePhoto(id, photo.path);
    if (ok) {
      s.photos.book = s.photos.book.filter(function(ph){ return String(ph.id)!==String(id); });
      if (s.photos.principale && String(s.photos.principale.id)===String(id)) s.photos.principale=null;
      if (s.photos.photoCv && String(s.photos.photoCv.id)===String(id)) s.photos.photoCv=null;
      if (s.photos.pleinPied && String(s.photos.pleinPied.id)===String(id)) s.photos.pleinPied=null;
      render(); reopenDashboardBlock('photos');
    }
  }); });

  function ouvrirChoixBook(onChoisir){
    const modal = document.getElementById('ccBookModal'); if (!modal) return;
    const grid = modal.querySelector('[data-cc-book-grid]');
    grid.innerHTML = s.photos.book.length ? s.photos.book.map(function(ph){
      return '<button type="button" class="cc-book-choice" data-choix-id="'+ph.id+'"><img src="'+ph.url+'" alt="Photo du Book"><span>Choisir</span></button>';
    }).join('') : '<div class="cc-book-empty">Ajoutez d’abord des photos à votre Book.</div>';
    modal.classList.add('open');
    modal.dataset.onChoisir = '';
    modal._onChoisir = onChoisir;
  }
  function fermerChoixBook(){ const m=document.getElementById('ccBookModal'); if (m) m.classList.remove('open'); }

  document.getElementById('uPhotoCv')?.addEventListener('click', function(){
    ouvrirChoixBook(async function(photo){ const ok = await Store.setRolePhoto('photo_cv', photo.id); if (ok) { s.photos.photoCv=photo; render(); reopenDashboardBlock('photos'); toast('Photo CV définie'); } });
  });
  document.getElementById('uPrincipale')?.addEventListener('click', function(){
    ouvrirChoixBook(async function(photo){ const ok = await Store.setRolePhoto('principale', photo.id); if (ok) { s.photos.principale=photo; render(); reopenDashboardBlock('photos'); toast('Photo de profil définie'); } });
  });
  document.getElementById('uPleinPied')?.addEventListener('click', function(){
    ouvrirChoixBook(async function(photo){ const ok = await Store.setRolePhoto('photo_pleinpied', photo.id); if (ok) { s.photos.pleinPied=photo; render(); reopenDashboardBlock('photos'); toast('Photo plein pied définie'); } });
  });
  document.querySelectorAll('[data-cc-book]').forEach(function(btn){ btn.addEventListener('click', function(e){
    e.stopPropagation();
    const slot = parseInt(btn.dataset.ccBook,10);
    ouvrirChoixBook(async function(photo){
      if (photo.compcardOrdre) { toast('Cette photo occupe déjà l’emplacement '+photo.compcardOrdre, true); return; }
      const ok = await Store.setCompcardOrdre(photo.id, slot);
      if (ok) { photo.compcardOrdre = slot; render(); reopenDashboardBlock('photos'); toast('Photo affectée à l’emplacement '+slot); }
    });
  }); });
  document.querySelectorAll('[data-clear-cc-slot]').forEach(function(btn){ btn.addEventListener('click', async function(e){
    e.stopPropagation();
    const slot = parseInt(btn.dataset.clearCcSlot,10);
    const photo = s.photos.book.find(function(ph){ return ph.compcardOrdre===slot; });
    if (!photo) return;
    const ok = await Store.setCompcardOrdre(photo.id, null);
    if (ok) { render(); reopenDashboardBlock('photos'); toast('Emplacement '+slot+' libéré — la photo reste dans le Book'); }
  }); });

  document.addEventListener('click', function(e){
    if (e.target.closest('[data-cc-book-close]') || e.target.id==='ccBookModal') fermerChoixBook();
    const choix = e.target.closest('[data-choix-id]');
    if (choix) {
      const modal = document.getElementById('ccBookModal');
      const photo = s.photos.book.find(function(ph){ return String(ph.id)===String(choix.dataset.choixId); });
      if (photo && modal && modal._onChoisir) { modal._onChoisir(photo); }
      fermerChoixBook();
    }
  });
}

const LIBELLES_COMPETENCES = {
  runway:'Runway / Défilé', pose:'Pose photographique', editorial:'Editorial', campagne:'Fashion campaign',
  fitting:'Fitting', presentation:'Présentation de collection', expression:'Expression corporelle',

};
const ORDRE_COMPETENCES = ['runway','pose','editorial','campagne','fitting','presentation','expression','equipe','discipline'];
const ORDRE_CATEGORIES_PROJETS = ['Défilés','Campagnes & Éditoriaux','Shootings','Autres expériences'];
function categoriserProjet(type){
  if (type==='Défilé') return 'Défilés';
  if (['Campagne','Publicité','Éditorial','Lookbook'].indexOf(type)!==-1) return 'Campagnes & Éditoriaux';
  if (type==='Shooting') return 'Shootings';
  return 'Autres expériences';
}
function groupExperiences(){
  const groupes = ORDRE_CATEGORIES_PROJETS.map(function(label){ return { label:label, items:[] }; });
  state.experiences.forEach(function(e){
    const cat = categoriserProjet(e.type);
    const groupe = groupes.find(function(g){ return g.label===cat; });
    const meta = [e.lieu, formaterPeriode(e.annee)].filter(Boolean).filter(function(x){return x!=='—';});
    groupe.items.push((e.nom||'Expérience') + (meta.length ? ' ('+meta.join(', ')+')' : ''));
  });
  return groupes.filter(function(g){ return g.items.length; });
}

    return;
  }
  if (recuperationMdpEnCours) return; // le gestionnaire PASSWORD_RECOVERY prend déjà le relais
  try{
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { renderAuthGate(); return; }
    await demarrerApresConnexion();
  }catch(e){
    console.error(e);
    renderAuthGate();
  }
})();

</script>
