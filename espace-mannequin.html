<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://js-de.sentry-cdn.com https://browser.sentry-cdn.com 'sha256-KI/RL/fiDoVW9pCbe4X9SKgSY/WzBxWAeFE4z53H/Ws=' 'sha256-GR5DmaFaylQQ9Gre6c17bVX90WiLQoCCdDnT/loTjLM='; style-src 'self' https://fonts.googleapis.com 'sha256-2RaJjkt0dwCPrM/WQd2sjLywmysdtxLwAh6UXghu0HQ=' 'sha256-l6fymG/9VFModmkt4+Cju+Misw/e9E3nOMRhpZL+0so=' 'sha256-6D2Th3h9EGL+b6LXIrxvvzszGa1GUaL1WinrbmhLeKM=' 'sha256-VTFjKJoosvUHJwUEBfSuoB4m5qYD0j+kM8YMTnuF4Gk=' 'sha256-2FuIzA/jw592F7ZfpulB+L+cfSJQrktkado/E49v3ZE=' 'sha256-d2Cr+T6akME7ZgN5doYbwMiih1pizW9iPj5yCqayDkw=' 'sha256-a3Gb0nx1B2Ke6ubkKs8+b/cb2dfYvhrPSYBor9C3xs4='; worker-src 'self' blob:;">
<script src="https://js-de.sentry-cdn.com/9213fdda0531f437e2c1abd310598a77.min.js" crossorigin="anonymous"></script>
<script src="js/surveillance.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace mannequin — Maître Akesse Model Management</title>
<meta name="theme-color" content="#080707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  /* Couleurs identiques à celles du reste du site (css/style.css) — mêmes
     noms de variables déjà utilisés dans ce fichier, valeurs alignées pour
     que Premium 20 partage exactement l'identité visuelle de l'agence. */
  --noir:#060504;
  --noir-2:#0e0b0a;
  --bordeaux:#7a1220;
  --bordeaux-2:#9c1c2c;
  --ivoire:#f4f0ea;
  --ivoire-2:#e8e0d2;
  --or:#d55468;
  --or-clair:#d55468;
  --texte-clair:rgba(244,240,234,.72);
  --texte-tres-clair:rgba(244,240,234,.45);
  --ok:#7fae7f;
  --serif:'Cormorant Garamond',serif;
  --sans:'Jost',sans-serif;
  --radius:2px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(92,15,30,.35), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(213,84,104,.08), transparent 55%),
    var(--noir);
  color:var(--ivoire);
  font-family:var(--sans);
  font-weight:300;
  letter-spacing:.01em;
  min-height:100%;
  line-height:1.5;
}
img,svg{max-width:100%}
a{color:inherit}

.demo-banner{background:linear-gradient(90deg,var(--bordeaux-2),var(--bordeaux));color:var(--ivoire);text-align:center;font-size:.7rem;letter-spacing:.04em;padding:9px 14px}
.demo-banner b{color:var(--or-clair)}
.auth-loading{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--texte-clair);font-size:.85rem}
.spinner{width:26px;height:26px;border:2px solid rgba(244,237,225,.2);border-top-color:var(--or);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* ---------- shell ---------- */
.shell{max-width:960px;margin:0 auto;padding:40px 22px 90px}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-bottom:34px;padding-bottom:22px;
  border-bottom:1px solid rgba(213,84,104,.22);
}
.wordmark{display:flex;align-items:center}
.wordmark img{height:46px;width:auto;display:block}
.espace-tag{font-size:.72rem;color:var(--texte-clair);letter-spacing:.06em;text-align:right}
.espace-tag b{display:block;font-family:var(--serif);font-style:italic;color:var(--ivoire);font-size:1.15rem;font-weight:500}
.top-right{display:flex;align-items:center;gap:14px}
@media(max-width:480px){.top-right{flex-direction:column;align-items:flex-end;gap:6px}}

/* ---------- greeting card ---------- */
.greet{
  background:linear-gradient(160deg,var(--noir-2),rgba(92,15,30,.25));
  border:1px solid rgba(213,84,104,.28);
  border-radius:var(--radius);
  padding:26px 28px;margin-bottom:30px;
}
.greet h1{font-family:var(--serif);font-weight:500;font-style:italic;font-size:1.7rem;margin:0 0 8px;color:var(--ivoire)}
.greet p{margin:0 0 18px;color:var(--texte-clair);font-size:.92rem;max-width:56ch}
.progress-row{display:flex;align-items:center;gap:14px}
.progress-track{flex:1;height:3px;background:rgba(244,237,225,.12);position:relative;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--bordeaux-2),var(--or));transition:width .5s ease}
.progress-pct{font-size:.78rem;color:var(--or-clair);min-width:3em;text-align:right}

/* ---------- stepper ---------- */
.stepper{display:flex;flex-wrap:wrap;gap:0;margin-bottom:26px;border:1px solid rgba(244,237,225,.1)}
.step-tab{
  flex:1 1 auto;min-width:110px;text-align:center;padding:13px 8px;
  font-size:.72rem;letter-spacing:.04em;color:var(--texte-tres-clair);
  border-right:1px solid rgba(244,237,225,.08);cursor:pointer;position:relative;
  background:transparent;
}
.step-tab:last-child{border-right:none}
.step-tab .n{display:block;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--texte-clair);margin-bottom:2px}
.step-tab.active{background:rgba(213,84,104,.1);color:var(--ivoire)}
.step-tab.active .n{color:var(--or-clair)}
.step-tab.done .n::after{content:'✓';margin-left:4px;color:var(--ok)}
.step-tab.locked{cursor:default;opacity:.4}

/* ---------- panel / card ---------- */
.panel{
  background:var(--noir-2);
  border:1px solid rgba(213,84,104,.2);
  border-radius:var(--radius);
  padding:30px clamp(18px,4vw,38px);
  animation:panelIn .4s ease;
}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.block-edit[style*="display: block"]{animation:panelIn .3s ease}
.panel h2{
  font-family:var(--serif);font-weight:500;font-style:italic;font-size:1.5rem;
  color:var(--ivoire);margin:0 0 4px;
}
.panel .sub{color:var(--texte-tres-clair);font-size:.82rem;margin:0 0 26px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 22px}
.grid.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:620px){.grid,.grid.g3{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:2px}
.field.full{grid-column:1/-1}
.field label{font-size:.72rem;letter-spacing:.05em;color:var(--texte-clair)}
.field label .req{color:var(--or-clair);margin-left:2px}
.field input[type=text],.field input[type=date],.field input[type=tel],.field input[type=email],.field input[type=number],.field select,.field textarea{
  background:rgba(244,237,225,.04);
  border:1px solid rgba(244,237,225,.18);
  border-radius:var(--radius);
  color:var(--ivoire);
  padding:11px 12px;
  font-family:var(--sans);font-size:.92rem;font-weight:300;
  outline:none;transition:border-color .2s, background .2s;
}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--or);background:rgba(213,84,104,.06);
}
.field input::placeholder,.field textarea::placeholder{color:var(--texte-tres-clair)}
.field.invalid input,.field.invalid select{border-color:var(--bordeaux-2);background:rgba(122,22,38,.12)}
.err-msg{font-size:.7rem;color:#d55468;min-height:1em}

.field-autre{display:none;margin-top:-3px}
.tel-row{display:flex;gap:8px}
.tel-row select{flex:0 0 auto;max-width:150px}
.tel-row input{flex:1;min-width:0}

.radio-row,.check-row{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:2px}
.radio-opt,.check-opt{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--texte-clair);cursor:pointer}
.radio-opt input,.check-opt input{accent-color:var(--or);width:16px;height:16px;cursor:pointer}
.radio-opt.selected,.check-opt.selected{color:var(--ivoire)}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--sans);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;
  padding:13px 26px;border-radius:var(--radius);border:1px solid var(--or);
  background:transparent;color:var(--or-clair);cursor:pointer;transition:all .25s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:rgba(213,84,104,.12)}
.btn.primary{background:linear-gradient(120deg,var(--bordeaux-2),var(--bordeaux));border-color:var(--bordeaux-2);color:var(--ivoire)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:rgba(244,237,225,.25);color:var(--texte-clair)}
.btn.ghost:hover{border-color:var(--ivoire);color:var(--ivoire);background:rgba(244,237,225,.05)}
.btn.small{padding:8px 16px;font-size:.68rem}
.btn.saved{border-color:var(--ok);color:var(--ok);background:rgba(127,174,127,.1)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block-btn{width:100%;justify-content:center}
.actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px}
.actions-row.end{justify-content:flex-end}

/* ---------- experiences ---------- */
.exp-card{
  border:1px solid rgba(244,237,225,.15);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:14px;align-items:center;
}
.exp-fields{display:grid;grid-template-columns:150px 1fr 130px 90px;gap:10px;flex:1}
@media(max-width:680px){.exp-fields{grid-template-columns:1fr 1fr}}
.exp-fields select,.exp-fields input{
  background:rgba(244,237,225,.04);border:1px solid rgba(244,237,225,.18);border-radius:var(--radius);
  color:var(--ivoire);padding:9px 10px;font-family:var(--sans);font-size:.84rem;font-weight:300;outline:none;
  transition:border-color .2s, background .2s;
}
.exp-fields select:focus,.exp-fields input:focus{border-color:var(--or);background:rgba(213,84,104,.06)}
.exp-fields input::placeholder{color:var(--texte-tres-clair)}
.exp-remove{background:none;border:none;color:var(--texte-tres-clair);cursor:pointer;font-size:.72rem;text-decoration:underline}
.exp-remove:hover{color:#d55468}
.exp-empty{color:var(--texte-tres-clair);font-size:.85rem;font-style:italic;padding:14px 0}
.type-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.type-chip{border:1px solid rgba(244,237,225,.2);color:var(--texte-clair);font-size:.72rem;padding:6px 12px;border-radius:20px}

/* ---------- upload zones ---------- */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:620px){.upload-grid{grid-template-columns:1fr}}
.upload-box{
  border:1px dashed rgba(213,84,104,.45);border-radius:var(--radius);
  aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:rgba(244,237,225,.03);cursor:pointer;text-align:center;padding:14px;position:relative;overflow:hidden;
  transition:border-color .2s,background .2s;
}
.upload-box:hover{border-color:var(--or);background:rgba(213,84,104,.06)}
.upload-box.filled{border-style:solid}
.upload-box .ic{font-size:1.6rem;color:var(--or-clair)}
.upload-box .lbl{font-size:.78rem;color:var(--texte-clair)}
.upload-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upload-box .lbl-over{position:relative;z-index:1;background:rgba(13,10,8,.6);padding:4px 8px;border-radius:2px}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:520px){.book-grid{grid-template-columns:repeat(2,1fr)}}
.book-thumb-remove{position:absolute;top:6px;right:6px;background:rgba(13,10,8,.8);border:1px solid rgba(244,237,225,.3);color:var(--ivoire);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.7rem;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.book-thumb-remove:hover{border-color:#d55468;color:#d55468}
.book-add{
  aspect-ratio:3/4;border-radius:var(--radius);border:1px dashed rgba(213,84,104,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;color:var(--or-clair);font-size:1.4rem;background:rgba(244,237,225,.03);
  transition:border-color .2s, background .2s;
}
.book-add:hover{border-color:var(--or);background:rgba(213,84,104,.07)}
.book-add span{font-size:.68rem;letter-spacing:.03em;color:var(--texte-clair)}
.cc-counter{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--texte-clair);margin:0 0 22px}
.cc-counter b{color:var(--or-clair);font-family:var(--sans);font-weight:500}
.cc-counter.full b{color:var(--ok)}
.book-thumb{
  aspect-ratio:3/4;border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(122,22,38,.3),rgba(213,84,104,.08));
  border:1px solid rgba(244,237,225,.14);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  font-size:1.2rem;color:var(--texte-tres-clair);
}
.book-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compcard-check{position:absolute;bottom:6px;right:6px;background:rgba(13,10,8,.75);border-radius:3px;padding:3px 6px;font-size:.62rem;display:flex;align-items:center;gap:4px;color:var(--texte-clair);z-index:2}
.compcard-check input{accent-color:var(--or);width:12px;height:12px}
.doc-row{display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(244,237,225,.14);border-radius:var(--radius);padding:13px 16px;margin-bottom:10px;font-size:.86rem}
.doc-row .name{color:var(--texte-clair)}
.doc-row .status-ok{color:var(--ok);font-size:.72rem;margin-left:8px}

/* ---------- recap ---------- */
.recap-block{border:1px solid rgba(244,237,225,.14);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.recap-block .lbl{font-size:.68rem;letter-spacing:.08em;color:var(--or-clair);text-transform:uppercase;margin-bottom:4px}
.recap-block .val{color:var(--texte-clair);font-size:.9rem}
.recap-link{background:none;border:none;color:var(--texte-tres-clair);font-size:.72rem;text-decoration:underline;cursor:pointer;white-space:nowrap}
.recap-link:hover{color:var(--or-clair)}
.visible-toggle{display:flex;align-items:flex-start;gap:12px;margin:24px 0;padding:16px;border:1px solid rgba(213,84,104,.3);border-radius:var(--radius);background:rgba(213,84,104,.05)}
.visible-toggle input{margin-top:3px;accent-color:var(--or);width:16px;height:16px}
.visible-toggle p{margin:0;font-size:.85rem;color:var(--texte-clair)}

/* ---------- confirmation ---------- */
.confirm{text-align:center;padding:50px 20px}
.confirm .check{
  width:64px;height:64px;border-radius:50%;border:1px solid var(--or);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  font-size:1.6rem;color:var(--or-clair);
}
.confirm.refuse .check{border-color:#d55468;color:#d55468}
.confirm h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.7rem;margin:0 0 10px}
.confirm p{color:var(--texte-clair);max-width:44ch;margin:0 auto 22px;font-size:.9rem}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:20px;border:1px solid var(--or);color:var(--or-clair)}
.status-pill.online{border-color:var(--ok);color:var(--ok)}
.status-pill.refuse{border-color:#d55468;color:#d55468}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- dashboard (post-validation) ---------- */
.online-banner{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:var(--ok);font-size:.8rem;letter-spacing:.05em}
.likes-banner-contenu{display:flex;align-items:center;gap:8px;margin-bottom:24px;padding:10px 14px;border:1px solid rgba(213,84,104,.35);border-radius:var(--radius);background:rgba(213,84,104,.08);color:#f2ede4;font-size:.85rem}
.alerte-incomplet{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px;padding:12px 16px;border:2px solid #e0384f;border-radius:var(--radius);background:rgba(224,56,79,.12);color:#f2ede4;font-size:.85rem;animation:alerte-clignote 1.6s ease-in-out infinite}
@keyframes alerte-clignote{0%,100%{border-color:#e0384f;background:rgba(224,56,79,.12)}50%{border-color:#ff5c72;background:rgba(224,56,79,.28)}}
@media (prefers-reduced-motion: reduce){.alerte-incomplet{animation:none;border-color:#e0384f}}
.alerte-lien{background:none;border:none;padding:0;color:#ff8a97;font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.alerte-lien:hover{color:#ffb3bc}
.blocks-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.blocks-grid{grid-template-columns:1fr}}
.block-card{border:1px solid rgba(244,237,225,.16);border-radius:var(--radius);padding:20px;transition:border-color .2s}
.block-card:hover{border-color:rgba(213,84,104,.4)}
.block-card .ic{font-size:1.3rem;margin-bottom:8px;display:block}
.block-card h3{font-family:var(--serif);font-style:italic;font-weight:500;margin:0 0 6px;font-size:1.15rem}
.block-card p{font-size:.78rem;color:var(--texte-tres-clair);margin:0 0 14px;min-height:2.2em}
.block-edit{margin-top:18px;padding-top:18px;border-top:1px dashed rgba(244,237,225,.2)}
.block-edit .btn.save-block{display:none}
.block-edit.dirty .btn.save-block{display:inline-flex}
.cv-cta{margin-top:26px;padding:22px;border:1px solid rgba(213,84,104,.35);border-radius:var(--radius);background:linear-gradient(150deg,rgba(92,15,30,.3),transparent);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cv-cta .txt h3{font-family:var(--serif);font-style:italic;font-weight:500;margin:0 0 4px;font-size:1.2rem}
.cv-cta .txt p{margin:0;font-size:.78rem;color:var(--texte-tres-clair)}
.lock-note{font-size:.68rem;color:var(--texte-tres-clair);margin-top:26px;text-align:center;letter-spacing:.03em}

/* ---------- admin simulation panel (DEMO uniquement) ---------- */
.admin-sim{
  position:fixed;left:16px;bottom:16px;z-index:60;
  background:rgba(13,10,8,.92);border:1px solid var(--or);border-radius:var(--radius);
  padding:14px 16px;max-width:250px;backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.admin-sim h4{margin:0 0 4px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or-clair)}
.admin-sim p{margin:0 0 10px;font-size:.72rem;color:var(--texte-tres-clair)}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--noir-2);border:1px solid var(--ok);color:var(--ivoire);padding:11px 18px;border-radius:var(--radius);font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .25s ease}
.toast.err{border-color:#d55468}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- CV / compcard overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,4,3,.88);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px calc(30px + env(safe-area-inset-bottom,0px))}
.overlay.hidden{display:none}
.overlay-close{position:sticky;top:0;display:flex;justify-content:flex-end;max-width:900px;margin:0 auto 10px;width:100%}
.overlay-close button{background:none;border:1px solid rgba(244,237,225,.3);color:var(--ivoire);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:.95rem}
.cv-sheet{
  width:100%;max-width:900px;background:var(--ivoire);color:#2a2622;border-radius:2px;overflow:hidden;
  font-family:var(--sans);
}
.cv-actions{padding:18px clamp(20px,5vw,40px) 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.private-note{background:#2c1116;color:#f0d3d7;font-size:.72rem;padding:10px 16px;text-align:center;letter-spacing:.03em}

/* ---------- MODEL CV — deux colonnes ---------- */
.mcv-wrap{display:flex;align-items:stretch}
@media(max-width:700px){.mcv-wrap{flex-direction:column}}
.mcv-side{
  width:300px;flex-shrink:0;background:linear-gradient(175deg,#141010,var(--noir) 55%);
  color:var(--ivoire);padding:0 0 26px;display:flex;flex-direction:column;
}
@media(max-width:700px){.mcv-side{width:100%}}
.mcv-photo{
  aspect-ratio:3/4;background:linear-gradient(160deg,#3a3632,#0d0a08 75%);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.mcv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.mcv-photo svg{width:34%;opacity:.28;position:relative;z-index:1}
.mcv-photo::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(13,10,8,.55) 0%,transparent 30%,transparent 62%,rgba(13,10,8,.6) 100%)}
.mcv-photo-logo{position:absolute;top:16px;left:16px;z-index:2}
.mcv-photo-logo img{height:30px;width:auto;display:block;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.mcv-tagline{font-size:.6rem;letter-spacing:.28em;color:var(--or-clair);text-align:center;padding:16px 10px 4px;text-transform:uppercase}
.mcv-name{padding:2px 22px 6px}
.mcv-nom{display:block;font-size:1.7rem;font-weight:600;letter-spacing:.04em;color:var(--ivoire)}
.mcv-prenom{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:2rem;color:var(--or-clair);margin-top:-2px}
.mcv-role{padding:0 22px 14px;font-size:.68rem;letter-spacing:.18em;color:var(--texte-clair);text-transform:uppercase}
.mcv-divider{height:1px;background:linear-gradient(90deg,var(--bordeaux-2),transparent);margin:0 22px 16px}
.mcv-info-list{list-style:none;margin:0;padding:0 22px;display:flex;flex-direction:column;gap:14px}
.mcv-info-list li{display:flex;gap:11px;align-items:flex-start}
.mcv-info-list svg{flex-shrink:0;width:16px;height:16px;margin-top:2px;color:var(--or-clair)}
.mcv-info-list .k{display:block;font-size:.6rem;letter-spacing:.06em;color:var(--texte-tres-clair);text-transform:uppercase}
.mcv-info-list .v{display:block;font-size:.82rem;color:var(--ivoire);line-height:1.4}
.mcv-cat{margin:20px 22px 0;padding-top:16px;border-top:1px solid rgba(244,237,225,.14)}
.mcv-cat .lbl{display:block;font-size:.6rem;letter-spacing:.14em;color:var(--texte-tres-clair);text-transform:uppercase;margin-bottom:4px}
.mcv-cat .val{font-family:var(--sans);font-weight:500;font-size:1rem;color:var(--ivoire);letter-spacing:.01em}
.mcv-quote{margin:22px 22px 0;padding-top:16px;border-top:1px solid rgba(244,237,225,.1);font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--ivoire-2);line-height:1.5}
.mcv-agency{margin-top:auto;padding:26px 22px 0;text-align:center}
.mcv-agency img{height:34px;width:auto;margin:0 auto}
.mcv-right{flex:1;display:flex;flex-direction:column;min-width:0}
.mcv-main{padding:26px clamp(18px,4vw,36px) 6px}
.mcv-topline{text-align:right;font-size:.68rem;letter-spacing:.32em;color:#6b6560;margin-bottom:18px;text-transform:uppercase}
.mcv-sec{margin-bottom:15px}
.mcv-sec h4{
  display:flex;align-items:center;gap:9px;font-family:var(--sans);font-weight:600;font-style:normal;font-size:.84rem;
  letter-spacing:.09em;text-transform:uppercase;color:#2a2622;margin:0 0 10px;
}
.mcv-sec h4 svg{width:17px;height:17px;color:var(--bordeaux-2);flex-shrink:0}
.mcv-sec h4::after{content:'';flex:1;height:1px;background:#ddd0b8;margin-left:4px}
.mcv-sec-subtile h4{font-size:.68rem;font-weight:500;color:#8a8378}
.mcv-sec-subtile h4 svg{width:13px;height:13px;color:#8a8378}
.mcv-sec-subtile h4::after{display:none}
.mcv-sec-subtile .mcv-profile-text{font-size:.78rem;font-style:italic;color:#8a8378}
.mcv-profil-row{display:flex;gap:20px;align-items:flex-start}
.mcv-profile-text{flex:1;font-size:.86rem;line-height:1.7;color:#2a2622;margin:0}
.mcv-side-tag{border-left:1px solid #ddd0b8;padding-left:14px;display:flex;flex-direction:column;gap:5px;font-size:.6rem;letter-spacing:.16em;color:#6b6560;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.mcv-two-col{display:flex;gap:0 26px}
.mcv-two-col>ul{flex:1;min-width:0}
@media(max-width:480px){.mcv-two-col{flex-direction:column}}
.mcv-kv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.mcv-two-col .mcv-kv{gap:9px}
.mcv-kv li{display:flex;justify-content:space-between;gap:14px;font-size:.82rem;border-bottom:1px dotted #ddd0b8;padding-bottom:7px}
.mcv-kv li span{color:#6b6560}
.mcv-kv li b{font-weight:500;color:#2a2622;text-align:right}
.mcv-expgroup{margin-bottom:16px}
.mcv-expgroup:last-child{margin-bottom:0}
.mcv-expgroup .gh{display:flex;align-items:center;gap:8px;font-size:.74rem;letter-spacing:.08em;color:#2a2622;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.mcv-expgroup .gh svg{width:15px;height:15px}
.mcv-expgroup ul{list-style:none;margin:0;padding:0 0 0 23px;display:flex;flex-direction:column;gap:5px}
.mcv-expgroup li{font-size:.82rem;color:#2a2622;position:relative}
.mcv-expgroup li::before{content:'';position:absolute;left:-14px;top:.6em;width:4px;height:4px;background:var(--bordeaux-2);border-radius:50%}
.mcv-bottom-row{display:flex;gap:32px;flex-wrap:wrap}
.mcv-skills{flex:1.4;min-width:220px;display:flex;flex-direction:column;gap:9px}
.mcv-skill-row{display:flex;align-items:center;gap:10px}
.mcv-skill-row .lbl{flex:0 0 150px;font-size:.76rem;color:#2a2622}
.mcv-skill-bar{flex:1;height:6px;background:#e3d9c4;border-radius:3px;overflow:hidden}
.mcv-skill-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bordeaux-2),var(--or));border-radius:3px}
.mcv-portfolio{flex:1;min-width:180px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.mcv-portfolio-photos{width:100%;max-width:280px;display:flex;flex-wrap:wrap;gap:3px}
.mcv-portfolio-photos div,.mcv-portfolio-photos img{flex:0 0 calc(20% - 2.4px);aspect-ratio:3/4;background:linear-gradient(165deg,#5c4a3a,#2a2622);object-fit:cover;width:100%;border-radius:2px}
.mcv-qr{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mcv-qr img{width:132px;height:132px;background:#fff;border:1px solid #ddd0b8;padding:6px}
.mcv-qr span{font-size:.62rem;color:#6b6560;letter-spacing:.03em}
.mcv-portfolio .cap{font-size:.7rem;color:#6b6560;line-height:1.4;max-width:20ch}
.mcv-portfolio .soc{display:flex;align-items:center;gap:8px;font-size:.76rem;color:#2a2622}
.mcv-portfolio .soc svg{width:15px;height:15px;color:var(--bordeaux-2)}

/* ---------- compcard print sheet ---------- */
.compcard-sheet{width:100%;max-width:520px;background:var(--ivoire);color:#2a2622}
.cc-top{aspect-ratio:3/4;background:linear-gradient(160deg,#5c0f1e,#0d0a08);position:relative;overflow:hidden}
.cc-top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc-top .cc-name{position:absolute;bottom:16px;left:18px;color:var(--ivoire);font-family:var(--serif);font-style:italic;font-size:1.6rem;z-index:1}
.cc-meas-strip{display:flex;justify-content:space-around;padding:12px 10px;background:#efe6d4;font-size:.7rem;text-align:center}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#ddd0b8}
.cc-grid div,.cc-grid img{aspect-ratio:3/4;background:linear-gradient(160deg,#7a1626,#151009);object-fit:cover;width:100%}
.cc-brand{text-align:center;padding:10px;font-size:.66rem;letter-spacing:.15em;color:#6b6560;text-transform:uppercase}

/* Pastille WhatsApp flottante — injectée par js/app.js sur toutes les pages du
   site ; cette page a son propre design autonome (pas de <link> vers
   css/style.css pour éviter toute collision de classes), donc on reprend ici
   juste la règle nécessaire pour qu'elle s'affiche correctement. */
.whatsapp-flottant{position:fixed;bottom:1.4rem;left:1.4rem;z-index:200;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(213,84,104,.5),0 0 24px rgba(213,84,104,.35),0 6px 18px rgba(0,0,0,.35);transition:transform .25s ease,box-shadow .25s ease}
.whatsapp-flottant:hover{transform:scale(1.08)}
.whatsapp-flottant svg{width:28px;height:28px}
@media(max-width:700px){.whatsapp-flottant{width:50px;height:50px;bottom:1rem;left:1rem}}

  <div class="auth-loading"><div class="spinner"></div><span>Chargement de votre espace…</span></div>
</div>

<div class="overlay hidden" id="overlay"><div id="overlayContent"></div></div>

<script>window.MA2M_SESSION_REQUISE = true;</script>

<script>
/* =========================================================================
   ESPACE MANNEQUIN — MA2M — PREMIUM 20
   Interface Premium 20 (wizard en 6 étapes + tableau de bord post-validation),
   connectée aux vraies tables/colonnes/fonctions Supabase de l'agence — pas
   de table ni de colonne inventée, pas de mode démo, pas de donnée simulée.
   Le "vrai" schéma est celui de supabase-setup.sql / supabase-extension.sql,
   déjà utilisé par espace-mannequin-ancien.html (conservé en parallèle comme filet
   de sécurité pendant la mise au point de ce fichier).
   ========================================================================= */

/* ---------------------------------------------------------------- ÉTAT --- */
let currentUser = null;

function emptyState(){
  return {
    meta:{
      currentStep:1, editBlock:null, activeCompcardSlot:1,
      // Dérivés à l'affichage à partir des vraies colonnes (published /
      // en_attente_validation / raison_refus / premiere_publication_faite) —
      // jamais écrits tels quels en base, voir deriverStatutAffichage().
      statutAffichage:'brouillon', premierePublicationFaite:false, commentaireAdmin:''
    },
    identite:{ nomComplet:'', dateNaissance:'', villeNaissance:'', lieuNaissance:'', nationalite:'', ville:'', quartier:'', telephone:'', email:'', sexe:'' },
    physique:{
      taille:'', poids:'', poitrine:'', tourTaille:'', hanches:'', entrejambe:'', pointure:'',
      tailleVet:'', yeux:'', cheveux:'', carnation:''
    },
    formation:{ niveau:'', etablissement:'', particuliere:'', mannequin:'' },
    // Catégorie (New Face/Amateur/Professionnel) : choisie directement par
    // la mannequin (niveauMannequin) — deriverNiveauMannequin() ne sert plus
    // que de suggestion par défaut, à partir des années d'expérience, la
    // première fois qu'elle ouvre ce bloc.
    profilPro:{ anneesExperience:'', disponibilite:'', modelTypes:[], langues:[], niveauMannequin:'' },
    experiences:[],
    photos:{ principale:null, photoCv:null, pleinPied:null, couverture:null, book:[] },
    competences:{},
    citation:'',
    bio:'',
    instagram:''
  };
}
let state = emptyState();

function toNum(v){ const n = parseInt(v, 10); return (v===''||v===null||v===undefined||isNaN(n)) ? null : n; }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

// deriverNiveauMannequin() est partagée dans js/app.js (utilisée aussi par
// mannequin.html et espace-mannequin-ancien.html).

/* --- Mode guidé (première inscription) vs mode autonome (blocs indépendants)
   identique à la logique déjà en production : une fois premiere_publication_faite
   passé à true par le trigger serveur, c'est définitif — le mannequin garde
   toujours accès au tableau de bord (jamais reverrouillé derrière un écran
   "en attente"/"refusé"), seuls les bandeaux d'état changent. --- */
function deriverStatutAffichage(profil){
  if (profil.published) return 'valide';
  if (profil.en_attente_validation) return 'en_attente';
  if (!profil.published && !profil.en_attente_validation && profil.raison_refus) return 'refuse';
  return 'brouillon';
}

/* ------------------------------------------------------------- TOASTS --- */
function toast(msg, isErr){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* --------------------------------------------------------- AUTH RÉELLE ---
   Même flux que espace-mannequin-ancien.html : inscription avec code d'invitation
   (check_invite_code / consume_invite_code), connexion, récupération de
   mot de passe. Aucune redirection vers une page de connexion séparée —
   tout se passe sur cette page, comme sur l'ancien espace mannequin. */
// Détecté directement depuis l'URL (synchrone, avant tout appel réseau) —
// évite une course avec init() plus bas : si sb.auth.getSession() répond
// avant que l'évènement PASSWORD_RECOVERY (qui attend une validation
// réseau du jeton) n'ait eu le temps de poser recuperationMdpEnCours à
// true, demarrerApresConnexion() fonçait tout droit vers le tableau de
// bord, sans jamais proposer de changer le mot de passe.
function urlIndiqueRecuperationMdp(){
  return /type=recovery/.test(window.location.hash + window.location.search);
}
let recuperationMdpEnCours = urlIndiqueRecuperationMdp();

const WORDMARK_HTML = '<a class="wordmark" href="index.html"><img src="assets/logo-header.png" alt="Maître Akesse Model Management"></a>';

function viewAuthGate(){
  return '<div class="top">'+WORDMARK_HTML+'</div>' +
  '<div class="panel" id="authPanel">' +
    // 30/09 : des personnes venues postuler à un casting arrivaient ici et tentaient de se
    // connecter avec un faux code — on leur montre tout de suite le bon chemin.
    '<a class="em-vers-candidature" href="candidature.html">Vous souhaitez <strong>postuler à un casting</strong> ou <strong>rejoindre l’agence</strong> ? <span>Postuler ici →</span></a>' +
    '<div id="auth-onglets" class="p20-8">' +
      '<button type="button" class="btn small" id="auth-tab-connexion" data-auth-tab="connexion">Se connecter</button>' +
      '<button type="button" class="btn ghost small" id="auth-tab-inscription" data-auth-tab="inscription">Créer mon compte</button>' +
    '</div>' +
    '<div id="auth-panneau-connexion">' +
      '<h2>Connexion</h2><p class="sub">Accédez à votre espace mannequin.</p>' +
      '<div class="grid">' + field('E-mail','au-co-email','',{type:'email',req:true}) + field('Mot de passe','au-co-mdp','',{type:'password',req:true}) + '</div>' +
      '<div class="actions-row end"><button class="btn primary" id="au-co-valider">Se connecter</button></div>' +
      '<div id="au-co-msg" class="err-msg p20-14"></div>' +
      '<p class="p20-15"><a href="#" id="au-mdp-oublie-lien" class="p20-7">Mot de passe oublié ?</a></p>' +
    '</div>' +
    '<div id="auth-panneau-inscription" class="p20-9">' +
      '<h2>Créer mon compte</h2><p class="sub">Un code d’invitation vous a été fourni par l’agence.</p>' +
      '<div class="grid">' +
        field('Code d’invitation','au-in-code','',{req:true}) + field('Nom complet','au-in-nom','',{req:true}) +
        field('E-mail','au-in-email','',{type:'email',req:true}) + field('Mot de passe (8 caractères minimum)','au-in-mdp','',{type:'password',req:true}) +
      '</div>' +
      '<div class="actions-row end"><button class="btn primary" id="au-in-valider">Créer mon compte</button></div>' +
      '<div id="au-in-msg" class="err-msg p20-14"></div>' +
    '</div>' +
    '<div id="auth-panneau-mdp-oublie" class="p20-9">' +
      '<h2>Mot de passe oublié</h2><p class="sub">Indiquez votre e-mail — si un compte y est associé, un lien de réinitialisation vous sera envoyé.</p>' +
      field('E-mail','au-mo-email','',{type:'email'}) +

function afficherPanneauAuth(id){
  // 'block' explicite (jamais '') : plusieurs de ces panneaux portent une
  // classe utilitaire display:none (ex. p20-9) — un style inline vide ne
  // l'emporte pas dessus, le panneau resterait invisible même actif.
  ['auth-panneau-connexion','auth-panneau-inscription','auth-panneau-mdp-oublie','auth-panneau-nouveau-mdp'].forEach(function(p){
    const el = document.getElementById(p); if (el) el.style.display = (p===id) ? 'block' : 'none';
  });
  // L'onglet ouvert s'allume (30/09 : les onglets ne changeaient jamais d'aspect —
  // une personne a touché 4 fois « Se connecter » sans voir que c'était déjà ouvert).
  const tabCo = document.getElementById('auth-tab-connexion');
  const tabIn = document.getElementById('auth-tab-inscription');
  if (tabCo && tabIn && (id === 'auth-panneau-connexion' || id === 'auth-panneau-inscription')) {
    tabCo.classList.toggle('ghost', id !== 'auth-panneau-connexion');
    tabIn.classList.toggle('ghost', id !== 'auth-panneau-inscription');
    tabCo.setAttribute('aria-pressed', String(id === 'auth-panneau-connexion'));
    tabIn.setAttribute('aria-pressed', String(id === 'auth-panneau-inscription'));
  }
}

function bindAuthGate(){
  document.getElementById('auth-tab-connexion')?.addEventListener('click', function(){ afficherPanneauAuth('auth-panneau-connexion'); });
  document.getElementById('auth-tab-inscription')?.addEventListener('click', function(){ afficherPanneauAuth('auth-panneau-inscription'); });

  document.getElementById('au-co-valider')?.addEventListener('click', async function(){
    const msg = document.getElementById('au-co-msg');
    const email = val('au-co-email').trim(), mdp = val('au-co-mdp');
    // Champs vides : on le dit tout de suite, sans interroger le serveur
    // (Journal 30/09 18:17 : « missing email or phone »).
    if (!email || !mdp) { msg.textContent = !email && !mdp ? 'Merci d\'indiquer votre e-mail et votre mot de passe.' : (!email ? 'Merci d\'indiquer votre e-mail.' : 'Merci d\'indiquer votre mot de passe.'); return; }
    msg.textContent = 'Connexion…';
    const { error } = await sb.auth.signInWithPassword({ email, password: mdp });
    if (error) { msg.textContent = 'E-mail ou mot de passe incorrect.'; return; }
    msg.textContent = '';
    await demarrerApresConnexion();
  });

  document.getElementById('au-in-valider')?.addEventListener('click', async function(){
    const msg = document.getElementById('au-in-msg');
    const code = val('au-in-code').trim(), nom = val('au-in-nom').trim(), email = val('au-in-email').trim(), mdp = val('au-in-mdp');
    if (!code || !nom || !email) { msg.textContent = 'Merci de remplir tous les champs.'; return; }
    if (mdp.length < 8) { msg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return; }
    msg.textContent = 'Vérification du code…';

    const { data: codeValide, error: erreurCode } = await sb.rpc('check_invite_code', { code_input: code });
    if (erreurCode || !codeValide) { msg.textContent = "Ce code d'invitation est invalide ou déjà utilisé."; return; }

    const { data: signUpData, error: erreurSignUp } = await sb.auth.signUp({ email, password: mdp });
    if (erreurSignUp) { msg.textContent = "Erreur lors de la création du compte : " + erreurSignUp.message; return; }

    if (!signUpData.session) {
      msg.textContent = "Compte créé. Vérifiez votre boîte e-mail pour confirmer votre adresse avant de vous connecter.";
      return;
    }

    const { data: consomme, error: erreurConsomme } = await sb.rpc('consume_invite_code', { code_input: code });
    if (erreurConsomme || !consomme) {
      msg.textContent = "Ce code vient d'être utilisé par quelqu'un d'autre. Contactez l'agence pour un nouveau code.";
      await sb.auth.signOut();
      return;
    }

    // Filet de sécurité identique à l'ancien système : s'assurer que la fiche
    // model_profiles existe bien avant de continuer, avec quelques tentatives.
    let erreurProfil = null;
    for (let essai = 0; essai < 3; essai++) {
      const { error } = await sb.from('model_profiles').upsert({ id: signUpData.user.id, full_name: nom, published: false });
      erreurProfil = error;
      if (!error) break;
      await new Promise(function(r){ setTimeout(r, 1000); });
    }
    if (erreurProfil) {
      msg.textContent = "Compte créé, mais la fiche profil n'a pas pu être créée (" + erreurProfil.message + "). Reconnectez-vous pour réessayer, ou contactez l'agence.";
      return;
    }

    msg.textContent = '';
    toast('Compte créé avec succès !');
    await demarrerApresConnexion();
  });

  document.getElementById('au-mdp-oublie-lien')?.addEventListener('click', function(e){
    e.preventDefault();
    document.getElementById('au-mo-email').value = val('au-co-email');
    afficherPanneauAuth('auth-panneau-mdp-oublie');
  });
  document.getElementById('au-mo-retour')?.addEventListener('click', function(e){ e.preventDefault(); afficherPanneauAuth('auth-panneau-connexion'); });
  document.getElementById('au-mo-envoyer')?.addEventListener('click', async function(){
    const email = val('au-mo-email').trim(); const msg = document.getElementById('au-mo-msg');
    if (!email) return;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reinitialiser-mot-de-passe.html' });
    if (error) console.warn('resetPasswordForEmail (mannequin) :', error.message);
    msg.textContent = "Si cet e-mail est associé à un compte, un lien de réinitialisation vient d'être envoyé.";
  });

  document.getElementById('au-nm-valider')?.addEventListener('click', async function(){
    const nouveauMdp = val('au-nm-mdp'); const msg = document.getElementById('au-nm-msg');
    if (nouveauMdp.length < 8) { msg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return; }
    const { error } = await sb.auth.updateUser({ password: nouveauMdp });
    if (error) { msg.textContent = 'Erreur : ' + error.message; return; }
    recuperationMdpEnCours = false;
    await demarrerApresConnexion();
  });
}

function renderAuthGate(){
  const app = document.getElementById('app');
  app.innerHTML = viewAuthGate();
  bindAuthGate();
}

sb && sb.auth.onAuthStateChange(function(event){
  if (event !== 'PASSWORD_RECOVERY') return;

});

   les vraies colonnes de model_profiles. Rien n'est jamais écrit avec un nom
   de colonne inventé. */
function identiteToDb(d){
  return {
    full_name: d.nomComplet || null,
    date_naissance: d.dateNaissance || null,
    ville_naissance: d.villeNaissance || null,
    lieu_naissance: d.lieuNaissance || null,
    nationalite: d.nationalite || null,
    city: d.ville || null,
    quartier: d.quartier || null,
    phone: d.telephone || null,
    contact_email: d.email || null,
    category: d.sexe || null
  };
}
function physiqueToDb(p){
  return {
    height_cm: toNum(p.taille), weight_kg: toNum(p.poids), chest_cm: toNum(p.poitrine),
    waist_cm: toNum(p.tourTaille), hips_cm: toNum(p.hanches), inseam_cm: toNum(p.entrejambe),
    shoe_size: p.pointure || null, clothing_size: p.tailleVet || null,
    eye_color: p.yeux || null, hair_color: p.cheveux || null, carnation: p.carnation || null
  };
}
function formationToDb(f){
  return { niveau_etude: f.niveau || null, etablissement: f.etablissement || null, formation_particuliere: f.particuliere || null, formation_mannequin: f.mannequin || null };
}
function profilProToDb(pp){
  return {
    years_experience: pp.anneesExperience!=='' ? parseInt(pp.anneesExperience,10) : null,
    availability: pp.disponibilite || null,
    model_types: pp.modelTypes, languages: pp.langues.join(', '),
    niveau_mannequin: pp.niveauMannequin || null
  };
}

/* Champ "sexe" (femme/homme) déjà utilisé par tout le reste du site pour
   déterminer Hanches vs Entrejambe — on garde son vocabulaire (category),
   distinct de "niveau_mannequin" (New Face/Amateur/Professionnel), choisi
   par la mannequin elle-même dans le bloc Expérience. */
function mapProfileFromDb(row, contactPrive){
  const s = emptyState();
  if (!row) return s;
  s.meta.statutAffichage = deriverStatutAffichage(row);
  s.meta.premierePublicationFaite = !!row.premiere_publication_faite;
  s.meta.commentaireAdmin = row.raison_refus || '';
  Object.assign(s.identite, {
    nomComplet: row.full_name || '', dateNaissance: row.date_naissance || '', villeNaissance: row.ville_naissance || '', lieuNaissance: row.lieu_naissance || '',
    nationalite: row.nationalite || '', ville: row.city || '', quartier: row.quartier || '',
    telephone: (contactPrive && contactPrive.phone) || '', email: (contactPrive && contactPrive.contact_email) || '',
    sexe: row.category || ''
  });
  Object.assign(s.physique, {
    taille: (row.height_cm == null ? '' : row.height_cm), poids: (row.weight_kg == null ? '' : row.weight_kg), poitrine: (row.chest_cm == null ? '' : row.chest_cm), tourTaille: (row.waist_cm == null ? '' : row.waist_cm),
    hanches: (row.hips_cm == null ? '' : row.hips_cm), entrejambe: (row.inseam_cm == null ? '' : row.inseam_cm), pointure: row.shoe_size || '', tailleVet: row.clothing_size || '',
    yeux: row.eye_color || '', cheveux: row.hair_color || '', carnation: row.carnation || ''
  });
  Object.assign(s.formation, {
    niveau: row.niveau_etude || '', etablissement: row.etablissement || '', particuliere: row.formation_particuliere || '', mannequin: row.formation_mannequin || ''
  });
  Object.assign(s.profilPro, {
    anneesExperience: (row.years_experience == null ? '' : row.years_experience), disponibilite: row.availability || '',
    modelTypes: row.model_types || [], langues: (row.languages || '').split(',').map(function(l){return l.trim();}).filter(Boolean),
    niveauMannequin: row.niveau_mannequin || deriverNiveauMannequin(row.years_experience)
  });
  s.competences = row.competences || {};
  s.citation = row.citation || '';
  s.bio = row.bio || '';
  s.instagram = row.instagram || '';
  return s;
}

  /* Pipeline identique à l'ancien système : conversion HEIC, compression

     version moyenne (1600px) à côté — jamais de nouvelle bibliothèque de
     photos, tout reste dans model_photos / bucket model-photos. */
  async uploadPhoto(file){
    // Signalement dans le journal du tableau de bord (demande de la propriétaire,
    // 29/09/2026) : si l'envoi d'une photo échoue ou traîne, elle doit le voir, avec le
    // nom du mannequin, pour pouvoir le prévenir (souvent un problème de réseau).
    const qui = (currentUser && ((currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email)) || 'mannequin inconnu';
    const infosFichier = file ? ('« ' + (file.name || 'photo') + ' », ' + Math.round((file.size || 0) / 1024) + ' Ko, ' + (file.type || 'type inconnu')) : '';
    const alerteLenteur = setTimeout(() => {
      if (window.signalerErreur) window.signalerErreur('Envoi de photo très lent', qui + ' : une photo met plus de 90 secondes à partir', infosFichier);
    }, 90000);
    try{
      const fichierConverti = await convertirSiHeic(file);
      const fichier = await compresserPhotoOrigine(fichierConverti);
      const chemin = currentUser.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '-' + nomFichierSur(fichier.name);
      const url = await uploaderVersR2(currentUser.id, chemin, fichier, fichier.type || 'image/jpeg');

      let cheminMiniature=null, urlMiniature=null;
      const blobMiniature = await genererMiniature(fichier);
      if (blobMiniature) {
        cheminMiniature = currentUser.id + '/miniatures/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.jpg';
        try { urlMiniature = await uploaderVersR2(currentUser.id, cheminMiniature, blobMiniature, 'image/jpeg'); }
        catch(e) { console.warn('Miniature non envoyée :', e); cheminMiniature=null; }
      }
      let cheminMoyenne=null, urlMoyenne=null;
      const blobMoyenne = await genererMiniature(fichier, 1400, 0.78);
      if (blobMoyenne) {
        cheminMoyenne = currentUser.id + '/moyennes/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.jpg';
        try { urlMoyenne = await uploaderVersR2(currentUser.id, cheminMoyenne, blobMoyenne, 'image/jpeg'); }
        catch(e) { console.warn('Version moyenne non envoyée :', e); cheminMoyenne=null; }
      }

      const { data: row, error: dbErr } = await sb.from('model_photos').insert({
        model_id: currentUser.id, url, chemin, url_miniature:urlMiniature, chemin_miniature:cheminMiniature,
        url_moyenne:urlMoyenne, chemin_moyenne:cheminMoyenne, originale_optimisee:true
      }).select().single();
      if (dbErr) throw dbErr;
      return { id: row.id, path: chemin, url: urlMiniature||url, urlPleine:url, compcardOrdre:null };
    }catch(e){
      // e.message porte le vrai motif quand il vient d'un refus explicite du
      // serveur (ex. limite de photos atteinte) — l'afficher plutôt qu'un
      // message générique qui cacherait la cause réelle et la solution.
      console.warn(e);
      // Coupure réseau : le navigateur renvoie un message technique en anglais
      // (« Failed to fetch » sur Android, « Load failed » sur iPhone) — le remplacer
      // par une phrase compréhensible pour la mannequin.
      const brut = (e && e.message) || '';
      const reseau = /failed to fetch|load failed|networkerror|network request failed|réseau/i.test(brut);
      if (window.signalerErreur) window.signalerErreur('Envoi de photo échoué', qui + ' : ' + (reseau ? 'connexion coupée pendant l’envoi' : (brut || 'erreur inconnue')), infosFichier);
      toast(reseau
        ? 'Connexion interrompue pendant l’envoi de « ' + ((file && file.name) || 'la photo') + ' ». Vérifiez votre connexion et réessayez.'
        : (brut || "Échec de l'envoi de la photo"), true);
      return null;
    }finally{
      clearTimeout(alerteLenteur);
    }

      const suite = (restantes||[]).filter(function(r){ return String(r.id)!==String(photoId); });
      for (let i=0;i<suite.length;i++){

      }

    }
    const { error } = await sb.from('model_photos').update({ compcard_ordre: ordre }).eq('id', photoId).eq('model_id', currentUser.id);
    if (error) { console.error(error); toast('Échec de la sélection compcard', true); return false; }
    return true;
  },

/* ------------------------------------------------------- ENVOI VERS R2 ---
   Les photos du Book ne passent plus par Supabase Storage (bande passante
   trop coûteuse) mais par Cloudflare R2, via une URL signée temporaire que
   seule api/r2-presigner.js peut délivrer (clés R2 jamais côté navigateur). */
async function jetonSessionCourante(){
  const { data: { session } } = await sb.auth.getSession();
  return session ? session.access_token : null;
}
async function uploaderVersR2(modelId, chemin, blob, contentType){
  const jeton = await jetonSessionCourante();
  if (!jeton) throw new Error('Session expirée — reconnectez-vous.');
  // L'envoi part directement vers Cloudflare R2 (pas via notre propre serveur) :
  // sur une connexion mobile instable, ce trajet plus long échoue parfois une
  // fois puis réussit au second essai — on retente automatiquement avant de
  // faire remonter l'échec, plutôt que de faire porter cette fragilité réseau
  // à la mannequin dès le premier raté.
  let derniereErreur;
  for (let essai = 1; essai <= 3; essai++) {
    try {
      const reponse = await fetch('/api/r2-presigner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jeton },
        body: JSON.stringify({ modelId: modelId, chemin: chemin, contentType: contentType || 'image/jpeg' })
      });
      const resultat = await reponse.json().catch(function(){ return {}; });
      if (!reponse.ok) throw new Error(resultat.error || "Échec de l'obtention de l'URL d'envoi.");
      const envoi = await fetch(resultat.uploadUrl, { method: 'PUT', headers: { 'Content-Type': contentType || 'image/jpeg' }, body: blob });
      if (!envoi.ok) throw new Error("Échec de l'envoi vers le stockage.");
      return resultat.publicUrl;
    } catch (e) {
      derniereErreur = e;
      if (essai < 3) await new Promise(function(r){ setTimeout(r, 700 * essai); });
    }
  }
  throw derniereErreur;
}
async function supprimerDeR2(modelId, chemin){
  if (!chemin) return;
  try{
    const jeton = await jetonSessionCourante();
    if (!jeton) return;
    await fetch('/api/r2-presigner', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jeton },
      body: JSON.stringify({ action: 'suppression', modelId: modelId, chemin: chemin })
    });
  }catch(e){ console.warn('Suppression R2 non confirmée :', e); }
}

/* ---------------------------------------------------------- UTILS PHOTOS ---
   Repris à l'identique de espace-mannequin-ancien.html (même comportement, même
   pipeline HEIC/compression/miniatures) — voir README-TECHNIQUE.md. */
async function convertirSiHeic(fichier){
  const estHeic = /image\/hei(c|f)/i.test(fichier.type) || /\.(heic|heif)$/i.test(fichier.name);
  if (!estHeic || typeof heic2any === 'undefined') return fichier;
  try{
    const resultat = await heic2any({ blob: fichier, toType: 'image/jpeg', quality: 0.85 });
    const blobFinal = Array.isArray(resultat) ? resultat[0] : resultat;
    return new File([blobFinal], fichier.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
  }catch(e){ console.error('Conversion HEIC échouée, envoi du fichier original :', e); return fichier; }
}
function compresserPhotoOrigine(fichier, coteMax, qualite){
  coteMax = coteMax || 2200; qualite = qualite || 0.85;
  return new Promise(function(resolve){
    // Compresse toute photo lourde (> 900 Ko), pas seulement les JPEG : les captures
    // d'écran PNG ou les WebP de plusieurs Mo partaient telles quelles, très lentes à
    // envoyer sur une connexion mobile (audit du 28 septembre 2026). Les GIF sont
    // laissés intacts (animation). Sortie toujours en JPEG, sur fond blanc.
    const compressible = /^image\/(jpeg|jpg|pjpeg|png|webp)$/i.test(fichier.type || '');
    if (!compressible || fichier.size < 900*1024) { resolve(fichier); return; }
    const img = new Image();
    img.onload = function(){
      try{
        const coteActuel = Math.max(img.width, img.height);
        const ratio = coteActuel > coteMax ? coteMax/coteActuel : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
        const ctxC = canvas.getContext('2d');
        ctxC.fillStyle = '#fff'; ctxC.fillRect(0,0,canvas.width,canvas.height); // transparence PNG → blanc
        ctxC.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(function(blob){
          if (!blob || blob.size >= fichier.size) { resolve(fichier); return; }
          resolve(new File([blob], fichier.name.replace(/\.\w+$/, '.jpg'), { type:'image/jpeg' }));
        }, 'image/jpeg', qualite);
      }catch(e){ resolve(fichier); }
    };
    img.onerror = function(){ resolve(fichier); };
    img.src = URL.createObjectURL(fichier);
  });
}
function genererMiniature(fichier, coteMax, qualite){
  coteMax = coteMax || 500; qualite = qualite || 0.70;
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){
      try{
        const coteActuel = Math.max(img.width, img.height);
        const ratio = coteActuel > coteMax ? coteMax/coteActuel : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(function(blob){ resolve(blob||null); }, 'image/jpeg', qualite);
      }catch(e){ resolve(null); }
    };
    img.onerror = function(){ resolve(null); };
    img.src = URL.createObjectURL(fichier);
  });
}

function stepComplete(n){
  if (n===1) return !!(state.identite.nomComplet && state.identite.dateNaissance && state.identite.sexe);
  if (n===2) return !!(state.physique.taille && state.physique.poids);
  if (n===3) return !!state.formation.niveau;
  if (n===4) return state.experiences.length>0;
  if (n===5) return !!(state.photos.principale && state.photos.book.length);
  return false;
}

function viewWizard(){
  const pct = Math.round(((state.meta.currentStep-1)/6)*100 + (stepComplete(state.meta.currentStep)?100/6:0));
  const clamped = Math.min(100, Math.max(0,pct));
  return header() +
  '<div class="greet"><h1>Bonjour ' + echapperHtml((state.identite.nomComplet||'').split(' ')[0]||'') + '</h1>' +
  '<p>Complétez votre profil professionnel pour permettre à l’agence de créer votre dossier mannequin. Chaque étape s’enregistre au fur et à mesure — vous pouvez y revenir à tout moment avant l’envoi final.</p>' +
  '<div class="progress-row"><div class="progress-track"><div class="progress-fill" data-largeur="'+clamped+'"></div></div>' +
  '<div class="progress-pct">'+clamped+'%</div></div></div>' +
  '<div class="stepper">' + STEP_LABELS.map(function(l,i){
    const n=i+1; const cls = n===state.meta.currentStep?'active':(stepComplete(n)?'done':'');
    return '<button type="button" class="step-tab '+cls+'" data-goto="'+n+'"><span class="n">'+['①','②','③','④','⑤','⑥'][i]+'</span>'+l+'</button>';
  }).join('') + '</div>' +

}

function stepContent(n){
  if (n===1) return stepIdentite();
  if (n===2) return stepPhysique();

function field(label, id, value, opts){
  opts = opts || {};
  if (opts.tag==='select') {
    return '<div class="field '+(opts.full?'full':'')+'"><label for="'+id+'">'+label+(opts.req?'<span class="req">*</span>':'')+'</label>' +
      '<select id="'+id+'">' + (opts.options||[]).map(function(o){ return '<option value="'+echapperHtml(o.value)+'" '+(String(o.value)===String(value==null?'':value)?'selected':'')+'>'+echapperHtml(o.label)+'</option>'; }).join('') + '</select></div>';
  }
  // Select à liste fixe + repli "Autre" (texte libre) — le champ "Autre" n'a
  // jamais de style="" calculé dans le HTML (bloqué en silence par le CSP
  // strict de cette page) : sa visibilité initiale est posée juste après le
  // rendu via initSelectsAvecAutre() (element.style.display=…, une simple
  // affectation de propriété CSSOM, jamais concernée par le CSP).
  if (opts.tag==='select-autre') {
    const valeurs = opts.options || [];
    const estAutre = !!value && valeurs.indexOf(value) === -1;
    return '<div class="field '+(opts.full?'full':'')+'"><label for="'+id+'">'+label+(opts.req?'<span class="req">*</span>':'')+'</label>' +
      '<select id="'+id+'" data-avec-autre="1"><option value="">—</option>' +
        valeurs.map(function(o){ return '<option value="'+echapperHtml(o)+'" '+(o===value?'selected':'')+'>'+echapperHtml(o)+'</option>'; }).join('') +
        '<option value="Autre" '+(estAutre?'selected':'')+'>Autre</option>' +
      '</select>' +
      '<input type="text" class="field-autre" id="'+id+'-autre" placeholder="Précisez" value="'+(estAutre?echapperHtml(value):'')+'"></div>';
  }
  if (opts.tag==='textarea') {
    return '<div class="field '+(opts.full?'full':'')+'"><label for="'+id+'">'+label+(opts.req?'<span class="req">*</span>':'')+'</label>' +
      '<textarea id="'+id+'" placeholder="'+(opts.placeholder||'')+'"'+(opts.maxlength?' maxlength="'+opts.maxlength+'"':'')+'>'+echapperHtml(value||'')+'</textarea></div>';
  }
  return '<div class="field '+(opts.full?'full':'')+'"><label for="'+id+'">'+label+(opts.req?'<span class="req">*</span>':'')+'</label>' +
  '<input type="'+(opts.type||'text')+'" id="'+id+'" value="'+echapperHtml(value||'')+'" placeholder="'+(opts.placeholder||'')+'"'+(opts.maxlength?' maxlength="'+opts.maxlength+'"':'')+'></div>';
}

// Plage de nombres prête pour field({tag:'select'}) — mêmes plages que celles
// déjà en production sur espace-mannequin-ancien.html (remplirSelectNombres), pour
// éviter les fautes de frappe et les valeurs invraisemblables dans une liste
// déroulante plutôt qu'un champ numérique libre.
function plageNombres(min, max, pas, suffixe){
  const options = [{value:'',label:'—'}];
  for (let v = min; v <= max; v += pas) options.push({value:String(v), label:v+(suffixe||'')});
  return options;
}

// Après chaque rendu, bascule les champs "Autre" (texte libre) associés à un
// select selon sa valeur courante, et branche leur écoute de changement —
// element.style.display=… reste une affectation de propriété CSSOM, jamais
// concernée par le CSP strict de cette page (contrairement à style="" dans le HTML).
function initSelectsAvecAutre(){
  document.querySelectorAll('select[data-avec-autre]').forEach(function(sel){
    const autre = document.getElementById(sel.id + '-autre');
    if (!autre) return;
    autre.style.display = sel.value === 'Autre' ? 'block' : 'none';
    configurerSelectAvecAutre(sel.id, autre.id);
  });
}

  '<section class="documents-section"><div class="section-title-row"><div><span class="editor-kicker">CV</span><h3>Compétences mannequin</h3><p>Évaluez-vous honnêtement sur chaque compétence (1 à 5).</p></div></div>' +
    '<div class="grid g3">'+competencesHtml+'</div></section>' +
  '<div class="photo-principals-grid">' +
    '<div class="principal-photo-card '+(p.photoCv?'filled':'')+'" id="uPhotoCv">'+photoThumb(p.photoCv,'Photo CV')+'<div class="principal-photo-badge">PHOTO PRINCIPALE CV</div><div class="principal-photo-title">'+(p.photoCv?'Photo CV définie':'Choisir la photo du CV')+'</div><div class="principal-photo-hint">Portrait, buste ou 3/4 — la photo qui vous représente le mieux</div>' +
      '<label class="cc-upload-btn" data-cc-upload-label="photoCv"><input class="hidden-input" type="file" accept="image/*" id="fPhotoCv">Téléverser une nouvelle photo</label></div>' +
    '<div class="principal-photo-card '+(p.principale?'filled':'')+'" id="uPrincipale">'+photoThumb(p.principale,'Photo de profil')+'<div class="principal-photo-badge profile">PHOTO PRINCIPALE PROFIL</div><div class="principal-photo-title">'+(p.principale?'Photo profil définie':'Choisir la photo de profil')+'</div><div class="principal-photo-hint">Portrait, buste ou 3/4 — affichée sur votre fiche publique et dans THE BOOK</div>' +
      '<label class="cc-upload-btn" data-cc-upload-label="principale"><input class="hidden-input" type="file" accept="image/*" id="fPrincipale">Téléverser une nouvelle photo</label></div>' +
    '<div class="principal-photo-card '+(p.pleinPied?'filled':'')+'" id="uPleinPied">'+photoThumb(p.pleinPied,'Photo plein pied')+'<div class="principal-photo-badge fullbody">PHOTO PLEIN PIED</div><div class="principal-photo-title">'+(p.pleinPied?'Photo plein pied définie':'Choisir la photo plein pied')+'</div><div class="principal-photo-hint">Photo de référence plein pied</div>' +
      '<label class="cc-upload-btn" data-cc-upload-label="pleinPied"><input class="hidden-input" type="file" accept="image/*" id="fPleinPied">Téléverser une nouvelle photo</label></div>' +
    '<div class="principal-photo-card '+(p.couverture?'filled':'')+'" id="uCouverture">'+(p.couverture?'<img data-couv-preview src="'+p.couverture.url+'" alt="Photo de couverture">':'')+'<div class="principal-photo-badge cover">PHOTO DE COUVERTURE</div><div class="principal-photo-title">'+(p.couverture?'Photo de couverture définie':'Choisir la photo de couverture')+'</div><div class="principal-photo-hint">Bandeau en haut de votre fiche publique — plutôt une photo large</div>' +

  '</div>' +

    '<label class="book-multi-upload" for="fBook">＋ Ajouter des photos<input class="hidden-input" type="file" accept="image/*" id="fBook" multiple></label></div>' +

      return '<div class="book-thumb '+(ph.compcardOrdre?'cc-selected':'')+'" data-book-id="'+ph.id+'">'+photoThumb(ph,'Book')+
        (ph.compcardOrdre?('<div class="book-slot-tag">COMPCARD '+ph.compcardOrdre+'</div>'):'') +
        '<button class="book-thumb-remove" data-rmbook="'+ph.id+'" title="Supprimer">✕</button>' +
        '<button class="book-select-btn" data-book-cc-toggle="'+ph.id+'">'+(ph.compcardOrdre?'Retirer de la compcard':'+ Compcard')+'</button>' +
      '</div>';
    }).join('')+'</div></section>' +
  '<section class="compcard-builder"><div class="section-title-row"><div><span class="editor-kicker">COMPCARD</span><h3>Les 5 photos de votre compcard</h3><p>Choisissez, parmi vos photos du Book, celles qui composent votre compcard.</p></div><span class="cc-rule">'+compcardPhotos.length+' / 5 sélectionnées</span></div>' +
    '<div class="compcard-slots editable-slots">'+slots+'</div></section>' +
  '<div class="actions-row"><button class="btn ghost" data-goto="4">← Retour</button><button class="btn primary" id="save5">Continuer</button></div>';

function stepRecap(){
  const d = state.identite, ph = state.physique, f = state.formation;
  const rows = [
    ['Identité', (d.nomComplet||'—')+' · '+(state.profilPro.niveauMannequin || deriverNiveauMannequin(state.profilPro.anneesExperience))+' · '+(d.sexe==='femme'?'Femme':d.sexe==='homme'?'Homme':'—'), 1],
    ['Informations physiques', (ph.taille||'—')+' cm · '+(ph.poids||'—')+' kg', 2],

    '<div class="visible-toggle"><input type="checkbox" id="f-visible"><p>Rendre mon profil visible publiquement sur le site.</p></div>' +
    '<div class="actions-row"><button class="btn ghost" data-goto="5">← Retour</button><button class="btn primary" id="submitProfile">Soumettre mon profil</button></div>';
