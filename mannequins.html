<body>
<script async src="js/filet-reveal.js"></script>



<header class="site-header-v2" data-gabarit="entete" data-page="mannequins"></header>

<div class="menu-overlay" id="menuOverlay" data-gabarit="menu"></div>
<script src="js/gabarit.js"></script>

<section class="u-pb-1">
  <div class="container">
    <div class="eyebrow reveal">L'agence</div>
    <h1 class="reveal reveal-delay-1">The Book<span class="oeil">.</span></h1>
    <p class="u-mt-1-2 reveal reveal-delay-2">Sélectionnez les profils qui vous intéressent pour une demande de casting groupée.</p>
  </div>
</section>

<section class="u-pt-1">
  <div class="container">
    <div class="filtres reveal">
      <button class="filtre-btn actif" data-cat="tous">Tous</button>
      <button class="filtre-btn" data-cat="femme">Femmes</button>
      <button class="filtre-btn" data-cat="homme">Hommes</button>
    </div>
    <!-- Niveau (06/10/2026) : New Face / Main Board (= « Professionnel » en interne). -->
    <div class="filtres filtres-niveau reveal" role="group" aria-label="Niveau">
      <button class="filtre-btn filtre-niveau-btn actif" data-niveau="tous">Tous niveaux</button>
      <button class="filtre-btn filtre-niveau-btn" data-niveau="New Face">New Face</button>
      <button class="filtre-btn filtre-niveau-btn" data-niveau="Professionnel">Main Board</button>
    </div>

    <div class="filtres-avances reveal">
      <div class="form-champ u-grid-pleine-largeur">
        <label for="f-recherche">Rechercher un mannequin par nom</label>
        <input type="text" id="f-recherche" placeholder="ex. : Bolli">
      </div>
      <div class="form-champ">
        <label for="f-taille-min">Taille min (cm)</label>
        <input type="number" id="f-taille-min" placeholder="ex. : 170">
      </div>
      <div class="form-champ">
        <label for="f-taille-max">Taille max (cm)</label>
        <input type="number" id="f-taille-max" placeholder="ex. : 185">
      </div>
      <div class="form-champ">
        <label for="f-carnation">Carnation</label>
        <select id="f-carnation">
          <option value="">Toutes</option>
          <option value="Claire">Claire</option>
          <option value="Métisse claire">Métisse claire</option>
          <option value="Métisse foncée">Métisse foncée</option>
          <option value="Foncée">Foncée</option>
          <option value="Très foncée">Très foncée</option>
        </select>
      </div>
      <div class="form-champ">
        <label for="f-vetements">Taille vêtements</label>
        <input type="text" id="f-vetements" placeholder="ex. : M, 40">
      </div>
      <div class="form-champ">
        <label for="f-disponibilite">Disponibilité</label>
        <select id="f-disponibilite">
          <option value="">Toutes</option>
          <option value="immediate">Disponible immédiatement</option>
          <option value="rdv">Sur rendez-vous</option>
          <option value="mobile">Mobile pour déplacements</option>
        </select>
      </div>
    </div>

    <div id="grille" class="medaillon-grille"></div>
    <p id="vide" class="mannequins-vide u-hidden">Aucun profil ne correspond à ces critères.</p>
  </div>
</section>

<footer class="site-footer" data-gabarit="pied"></footer>

</body>
