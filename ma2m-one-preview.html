<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MA2M ONE — Démonstration</title><style> *{box-sizing:border-box}body{margin:0;background:#171313;color:#fff;font:16px system-ui}main{max-width:720px;margin:auto;background:#751d2a;min-height:100dvh;padding-bottom:95px}header,section{padding:24px}header{display:flex;justify-content:space-between;align-items:center;letter-spacing:4px}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.05}h1{font-size:clamp(38px,8vw,66px);margin:12px 0}h2{font-size:34px}p{line-height:1.6}small{letter-spacing:2px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ffffff55;background:transparent;color:white;border-radius:18px;padding:16px;text-align:left}button.primary{background:#f8f5f3;color:#751d2a;border:0;text-align:center;font-weight:600;width:100%}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}.hero{min-height:360px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(0deg,#171313e8,transparent),url('https://www.maitreakessemodelmanagement.com/assets/cours-talons/mannequin-podium.jpg?v=2') center 35%/cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:140px;display:flex;flex-direction:column;justify-content:space-between;background:#17131355}.tile b{font-family:Georgia;font-size:24px;font-weight:400}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);background:#171313;display:flex;justify-content:space-around;padding:12px 4px env(safe-area-inset-bottom,12px)}nav button{border:0;font-size:12px;padding:12px}input,select{width:100%;padding:14px;border:1px solid #ffffff55;border-radius:12px;background:#f8f5f3;color:#171313;margin:8px 0 18px}label{display:block}.progress{display:flex;gap:5px}.progress i{height:3px;background:#ffffff44;flex:1}.progress i.on{background:white}.options{display:grid;gap:12px}.options button.active{background:#f8f5f3;color:#751d2a}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.media label{border:1px dashed #ffffff88;border-radius:12px;padding:12px;min-height:100px;overflow:hidden;font-size:12px}.media input{font-size:11px;padding:5px}.note{font-size:12px;color:#f3dce0}.actions{display:flex;gap:12px;margin-top:24px}.screen{animation:appear .3s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><header><strong>MA2M.</strong><small>ONE / APERÇU</small></header><div id="view"></div><nav><button onclick="home()">⌂ Accueil</button><button onclick="openRoute(1)">◇ Castings</button><button onclick="openRoute(0)">◷ Cours</button><button onclick="openRoute(3)">○ Profil</button></nav></main><script>
const routes=[['Talons & Élégance','L’art de la démarche.',['Votre objectif','Votre formule','Votre niveau','Votre créneau','Votre profil','Vos médias','Récapitulatif'],[['Apprendre à marcher','Préparer un concours','Me perfectionner'],['En groupe','En privé'],['Débutante','Intermédiaire','Avancée'],null,null,null,null]],['Castings','Votre prochaine opportunité.',['Le projet','Votre expérience','Votre profil','Vos médias','Récapitulatif'],[['Consulter un exemple de casting'],['New Face','Mannequin expérimenté'],null,null,null]],['MA2M Academy','Le talent se cultive.',['Votre formation','Votre programme','Votre profil','Vos médias','Récapitulatif'],[['Formation initiale — 18 mois','Recyclage — 9 mois'],['Découvrir les conditions de formation'],null,null,null]],['Représentation','Votre carrière commence ici.',['Votre expérience','Votre univers','Votre profil','Vos médias','Récapitulatif'],[['2 ans et plus','Moins de 2 ans'],['Podium','Photo & éditorial','Les deux'],null,null,null]]];let r=0,s=-1,answers={};const v=document.querySelector('#view');function home(){v.innerHTML='<section class="hero screen"><small>ABIDJAN · CÔTE D’IVOIRE</small><h1>Votre avenir<br>prend forme.</h1><p>Une maison. Plusieurs expériences.</p></section><section><small>EXPLOREZ VOTRE UNIVERS</small><h2>Les expériences</h2><div class="grid">'+routes.map((x,i)=>`<button class="tile" onclick="openRoute(${i})"><small>0${i+1} ↗</small><b>${x[0]}</b></button>`).join('')+'</div><p class="note">Démonstration indépendante · aucune donnée transmise.</p></section>'}function openRoute(i){r=i;s=-1;answers={};render()}function render(){let x=routes[r];if(s<0){v.innerHTML=`<section class="hero screen"><small>EXPÉRIENCE 0${r+1}</small><h1>${x[0]}</h1><p>${x[1]}</p></section><section><button class="primary" onclick="next()">Commencer →</button><p class="note">Parcours de démonstration</p></section>`;return}if(s>=x[2].length){v.innerHTML='<section><h1>Merci.</h1><p>Vous avez terminé la démonstration. Aucun dossier ni paiement transmis.</p><button class="primary" onclick="home()">Retour à l’accueil</button></section>';return}let t=x[2][s],opts=x[3][s],content='';if(opts)content='<div class="options">'+opts.map((o,i)=>`<button class="${answers[s]===o?'active':''}" onclick="choose(${i})">${o}</button>`).join('')+'</div>';else if(t==='Votre profil')content='<label>Prénom fictif<input autocomplete="off" placeholder="Exemple : Alex" id="prenom"></label><label>Statut<select><option>Majeur</option><option>Mineur — autorisation parentale requise</option></select></label>';else if(t==='Vos médias')content='<div class="media">'+Array.from({length:6},(_,i)=>`<label>${i===5?'Vidéo':i===0?'Portrait':i===1?'Plein pied':'Photo '+(i+1)}<input type="file" accept="${i===5?'video/*':'image/*'}"></label>`).join('')+'</div><p class="note">Fichiers locaux uniquement. Pour les talons, le système actuel prévoit 2 à 5 photos.</p>';else if(t==='Votre créneau')content='<p>Les disponibilités réelles seront fournies par le système de réservation.</p><label>Date indicative<input type="date"></label>';else content='<p>Vérifiez votre parcours avant de terminer.</p>'+Object.values(answers).map(a=>`<p>✓ ${a}</p>`).join('')+'<p class="note">Aucun paiement ni envoi réel.</p>';v.innerHTML=`<section class="screen"><div class="progress">${x[2].map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div><p class="note">○ Profil privé · ${s+1}/${x[2].length}</p><h2>${t}</h2>${content}<div class="actions"><button onclick="back()">←</button><button class="primary" onclick="next()">${s===x[2].length-1?'Terminer l’aperçu':'Continuer →'}</button></div></section>`}function choose(i){answers[s]=routes[r][3][s][i];render()}function next(){if(s>=0&&routes[r][3][s]&&!answers[s])return;if(r===3&&s===0&&answers[s]==='Moins de 2 ans'){openRoute(2);return}s++;render();window.scrollTo(0,0)}function back(){s--;render()}home();</script></html>
