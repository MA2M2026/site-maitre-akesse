# Analyse SonarQube Cloud (automatique). Le journal des codes Supabase est un historique :
# chaque « Extension » remplace la version précédente d'une fonction (create or replace),
# et on garde l'ancienne pour savoir ce qui a été exécuté et quand. Ce n'est pas du code
# recopié à maintenir : il est exclu du seul calcul des doublons (il reste analysé pour
# la sécurité et la fiabilité).
sonar.cpd.exclusions=supabase-extension.sql,supabase-setup.sql

# Programmes d'essai « comme un visiteur » (scripts/tests-visiteur) : ils tournent seulement
# sur l'ordinateur de test, avec une base simulée, et ne sont jamais envoyés aux visiteurs.
# Leurs alertes (port d'essai tiré au hasard, démarrage du petit serveur local) ne concernent
# pas le site : ils sont déclarés comme essais et non comme code du site (12/10/2026).
# Même chose pour la base d'essai jetable (scripts/base-essai, 20/10/2026) : ses « update »
# sans « where » visent exprès toute une table d'essai, jamais la vraie base.
# Outils de fabrication des vidéos (outils/, 27/10/2026) : programmes lancés seulement sur l'ordinateur
# de travail pour dessiner une vidéo image par image ; jamais publiés (.vercelignore), pas du code du site.
sonar.exclusions=scripts/tests-visiteur/**,scripts/base-essai/**,outils/**
sonar.tests=scripts/tests-visiteur,scripts/base-essai
